/* Seminar 12 deck. Two inks on paper: no grey, no opacity, no borders. See DESIGN.md. */
:root {
  --paper: #F1F0EC;
  --ink: #17161B;
  --accent: #E4007C;
  --text: 'Literata', Georgia, 'Times New Roman', serif;
  --mono: 'PT Mono', ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); overflow: hidden; }
body { display: grid; place-items: center; font-family: var(--text); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
#stage { position: relative; cursor: default; user-select: none; -webkit-user-select: none; }
#dots { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#captions { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; pointer-events: none; }

[data-role] { position: absolute; margin: 0; font-kerning: normal; font-variant-numeric: lining-nums; }
[data-role='headline'] { left: 64px; top: 42px; max-width: 800px; font-weight: 600; font-size: 56px; line-height: 1.06; letter-spacing: -0.012em; text-wrap: balance; }
[data-role='body'] { left: 64px; max-width: 560px; font-weight: 400; font-size: 26px; line-height: 1.36; }
[data-role='label'] { font-style: italic; font-weight: 400; font-size: 24px; line-height: 1.25; white-space: nowrap; }
[data-role='label'].upright { font-style: normal; }
[data-role='label'][style*='width'] { white-space: normal; }
/* the figure: the one number of a state, large, sitting on the token strip; its unit shares the baseline */
[data-role='label'].figure { left: 64px; display: flex; align-items: baseline; gap: 26px; font-style: normal; font-size: 34px; line-height: 1; white-space: nowrap; }
[data-role='label'].figure b { font-weight: 600; font-size: 184px; line-height: 0.74; letter-spacing: -0.035em; }
[data-role='control'] { pointer-events: auto; font-size: 22px; line-height: 1.2; }
.mono { font-family: var(--mono); font-style: normal; letter-spacing: -0.01em; }
.arr { display: inline-block; width: 0.82em; height: 0.55em; margin: 0 0.06em; vertical-align: 0.06em; overflow: visible; }

/* the bottom line: honesty label and sources on the left, the counter on the right */
#foot { position: absolute; left: 64px; bottom: 26px; display: flex; align-items: baseline; gap: 22px; max-width: 920px; }
#foot [data-role] { position: static; }
#foot .tag { font-size: 22px; }
[data-role='src'] { font-size: 15px; line-height: 1.3; font-weight: 400; }
[data-role='counter'] { right: 64px; bottom: 24px; display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 15px; line-height: 1; }
[data-role='counter'] .who { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--paper); font-family: var(--text); font-weight: 600; font-size: 16px; }
[data-role='counter'] .pips { display: flex; align-items: center; gap: 5px; }
[data-role='counter'] .pips i { width: 4px; height: 4px; border-radius: 50%; background: var(--ink); }
[data-role='counter'] .pips i.on { width: 9px; height: 9px; }
[data-role='counter'] .mute { display: none; font-family: var(--text); font-style: italic; }
[data-role='counter'].muted .mute { display: inline; }

/* one control style for every state: words on ink, the chosen one in the accent's place is ink-filled */
[data-role='control'] button { font: inherit; color: var(--ink); background: none; border: 0; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
[data-role='control'] button[aria-pressed='true'], [data-role='control'] button.on { background: var(--ink); color: var(--paper); }
[data-role='control'] button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

</style>
</head>

<div id="stage"><canvas id="dots" aria-hidden="true"></canvas><div id="captions"></div></div>
<script>
// ---- engine/00-core.js
// Core: the Deck namespace, constants, query flags, seeded random, easing.
// Every other engine file and every state module hangs off window.Deck.
(function () {
  'use strict';
  const q = new URLSearchParams(location.search);

  const Deck = (window.Deck = {
    W: 1280, // stage width in logical units
    H: 720, // stage height
    N: 4096, // dots, always
    TOTAL: 14, // states

    // Query flags (contract): ?still=1 settled and seeded, ?mute=1 silent.
    still: q.get('still') === '1',
    muted: q.get('mute') === '1',
    demo: q.get('demo') || '', // engine demos for builders: ?demo=dombra|dombra6|strip|reserve

    // The two display names live here and nowhere else. А owns states 1-7, Б owns 8-14.
    SPEAKERS: { А: 'Докладчик А', Б: 'Докладчик Б' },

    // Palette (DESIGN.md). Two inks on paper; there is no grey and no opacity.
    PAPER: '#F1F0EC',
    INK: '#17161B',
    ACCENT: '#E4007C',

    // Ink ids for dots.
    K: 0, // ink
    A: 1, // accent

    // Dot radii in stage units (DESIGN.md, "Dot spec").
    R_MIN: 0.7, // smallest dot ever drawn; nothing is hidden
    R_FORM: 2.3, // a dot at full tone on the 6 px form screen

    // Caption geometry.
    MARGIN: 64,
    FONT_TEXT: 'Literata',
    FONT_DOTS: 'Literata', // face the glyph sampler draws with
    FONT_MONO: 'PT Mono',
  });

  Deck.speakerOf = function (n) {
    const letter = n <= 7 ? 'А' : 'Б';
    return { letter, name: Deck.SPEAKERS[letter] };
  };

  // Seeded random (mulberry32). Deck.rng(seed)() gives floats in [0, 1).
  Deck.rng = function (seed) {
    let a = (seed >>> 0) || 1;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  // Stable per-index hash in [0, 1): the same dot always gets the same value.
  Deck.hash = function (i, salt) {
    let h = Math.imul((i + 1) ^ ((salt || 0) * 0x9e3779b1), 0x85ebca6b);
    h ^= h >>> 13;
    h = Math.imul(h, 0xc2b2ae35);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };

  Deck.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  Deck.lerp = (a, b, t) => a + (b - a) * t;

  Deck.ease = {
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    out: (t) => 1 - Math.pow(1 - t, 3),
    in: (t) => t * t * t,
    linear: (t) => t,
  };
})();

// ---- engine/10-samplers.js
// Point samplers: everything a state needs to say where the 4096 dots go.
// A point is a plain object { x, y, r, c } in stage units (r radius, c ink id: Deck.K or Deck.A)
// plus optional tags a sampler adds (g glyph, tok token, col, row, part, s, u).
// The ORDER of points is the identity of dots: point i of a layout is dot i.
(function () {
  'use strict';
  const Deck = window.Deck;
  const { W, H, N } = Deck;
  const pts = (Deck.pts = {});

  // ---- helpers ---------------------------------------------------------------------------

  // Left-to-right order (column bands, top to bottom inside a band). This is the default
  // identity order: a state entered from any neighbour then flows left to left, right to right.
  pts.sortX = function (points, band) {
    const b = band || 6;
    return points.sort((p, q) => Math.floor(p.x / b) - Math.floor(q.x / b) || p.y - q.y);
  };

  pts.bounds = function (points) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of points) {
      if (p.x < x0) x0 = p.x;
      if (p.x > x1) x1 = p.x;
      if (p.y < y0) y0 = p.y;
      if (p.y > y1) y1 = p.y;
    }
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
  };

  // Set ink and/or radius on a list of points, in place. Returns the list.
  pts.paint = function (points, c, r) {
    for (const p of points) {
      if (c != null) p.c = c;
      if (r != null) p.r = r;
    }
    return points;
  };

  // ---- mask to points (the halftone screen) -------------------------------------------------

  // Offscreen stage-sized canvas -> integral image of alpha.
  function integral(draw) {
    const cv = document.createElement('canvas');
    cv.width = W;
    cv.height = H;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = '#000';
    ctx.strokeStyle = '#000';
    if (typeof draw === 'function') draw(ctx);
    else ctx.drawImage(draw, 0, 0, W, H); // a canvas or an image: its alpha is the tone
    const a = ctx.getImageData(0, 0, W, H).data;
    const I = new Float64Array((W + 1) * (H + 1));
    for (let y = 0; y < H; y++) {
      let row = 0;
      for (let x = 0; x < W; x++) {
        row += a[(y * W + x) * 4 + 3];
        I[(y + 1) * (W + 1) + x + 1] = I[y * (W + 1) + x + 1] + row;
      }
    }
    return I;
  }

  // Mean alpha (0..1) in the box of half-size h around (x, y).
  function coverage(I, x, y, h) {
    let x0 = Math.round(x - h), x1 = Math.round(x + h), y0 = Math.round(y - h), y1 = Math.round(y + h);
    const area = (x1 - x0) * (y1 - y0);
    if (area <= 0) return 0;
    x0 = Deck.clamp(x0, 0, W); x1 = Deck.clamp(x1, 0, W);
    y0 = Deck.clamp(y0, 0, H); y1 = Deck.clamp(y1, 0, H);
    const s = I[y1 * (W + 1) + x1] - I[y0 * (W + 1) + x1] - I[y1 * (W + 1) + x0] + I[y0 * (W + 1) + x0];
    return s / (255 * area);
  }

  function screen(I, pitch, angleDeg, min) {
    const th = (angleDeg * Math.PI) / 180, cs = Math.cos(th), sn = Math.sin(th);
    const cx = W / 2, cy = H / 2, reach = Math.ceil(Math.hypot(W, H) / 2 / pitch) + 1;
    const out = [];
    for (let j = -reach; j <= reach; j++) {
      for (let i = -reach; i <= reach; i++) {
        const x = cx + (i * cs - j * sn) * pitch, y = cy + (i * sn + j * cs) * pitch;
        if (x < 0 || x > W || y < 0 || y > H) continue;
        const t = coverage(I, x, y, pitch / 2);
        if (t >= min) out.push({ x, y, t });
      }
    }
    return out;
  }

  // Deck.pts.mask(draw, opts) -> points on the halftone screen wherever `draw` put ink.
  //   draw   function (ctx) that fills shapes in stage coordinates (alpha = tone), or a canvas/image
  //   opts   { count, pitch = 6, angle = 45, fill = 0.385, min = 0.3, c = Deck.K }
  //          count: exact number of points; the pitch is then searched and the weakest edge dots dropped
  // A dot's radius is pitch * fill * sqrt(tone): tone is carried by dot size, never by opacity.
  pts.mask = function (draw, opts) {
    const o = Object.assign({ pitch: 6, angle: 45, fill: 0.385, min: 0.3, c: Deck.K }, opts);
    const I = integral(draw);
    let pitch = o.pitch, raw;
    if (o.count) {
      let lo = 2, hi = 48; // largest pitch that still yields at least `count` points
      for (let k = 0; k < 22; k++) {
        const mid = (lo + hi) / 2;
        if (screen(I, mid, o.angle, o.min).length >= o.count) lo = mid;
        else hi = mid;
      }
      pitch = lo;
      raw = screen(I, pitch, o.angle, o.min);
      if (raw.length > o.count) {
        raw.sort((a, b) => b.t - a.t);
        raw.length = o.count;
      }
    } else {
      raw = screen(I, pitch, o.angle, o.min);
    }
    const rmax = pitch * o.fill;
    const out = raw.map((p) => ({ x: p.x, y: p.y, r: Math.max(Deck.R_MIN, rmax * Math.sqrt(p.t)), c: o.c, t: p.t }));
    pts.sortX(out, pitch);
    out.pitch = pitch;
    return out;
  };

  // Deck.pts.text(str, opts) -> points that fill the glyphs of `str`.
  //   opts { x, y (baseline), size, fit (width in px; overrides size), align = 'left',
  //          weight = 900, font = Deck.FONT_DOTS, tracking = 0 (em), + every Deck.pts.mask option }
  // Each point carries g = index of the character it belongs to. The result has .size and .box.
  pts.text = function (str, opts) {
    const o = Object.assign({ x: Deck.MARGIN, y: H / 2, size: 200, align: 'left', weight: 900, font: Deck.FONT_DOTS, tracking: 0 }, opts);
    const probe = document.createElement('canvas').getContext('2d');
    const setFont = (ctx, size) => {
      ctx.font = `${o.weight} ${size}px "${o.font}"`;
      ctx.letterSpacing = `${o.tracking * size}px`;
      ctx.textBaseline = 'alphabetic';
    };
    let size = o.size;
    if (o.fit) {
      setFont(probe, 200);
      const m = probe.measureText(str);
      size = (200 * o.fit) / (m.actualBoundingBoxLeft + m.actualBoundingBoxRight);
    }
    setFont(probe, size);
    const m = probe.measureText(str);
    const inkW = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
    // x is the left edge of the ink for 'left', the centre for 'center', the right edge for 'right'
    let x = o.x + m.actualBoundingBoxLeft;
    if (o.align === 'center') x -= inkW / 2;
    if (o.align === 'right') x -= inkW;
    const out = pts.mask((ctx) => {
      setFont(ctx, size);
      ctx.fillText(str, x, o.y);
    }, o);
    const edges = [];
    for (let i = 1; i <= str.length; i++) edges.push(x + probe.measureText(str.slice(0, i)).width);
    for (const p of out) {
      let g = 0;
      while (g < edges.length - 1 && p.x > edges[g]) g++;
      p.g = g;
    }
    out.size = size;
    out.box = { x0: x - m.actualBoundingBoxLeft, x1: x + m.actualBoundingBoxRight, y0: o.y - m.actualBoundingBoxAscent, y1: o.y + m.actualBoundingBoxDescent };
    return out;
  };

  // Deck.pts.path(d, opts) -> points that fill (or stroke) an SVG path or a Path2D.
  //   opts { x = 0, y = 0, scale = 1, stroke (line width; fills when absent), + Deck.pts.mask options }
  pts.path = function (d, opts) {
    const o = Object.assign({ x: 0, y: 0, scale: 1 }, opts);
    const p = typeof d === 'string' ? new Path2D(d) : d;
    return pts.mask((ctx) => {
      ctx.translate(o.x, o.y);
      ctx.scale(o.scale, o.scale);
      if (o.stroke) {
        ctx.lineWidth = o.stroke;
        ctx.lineCap = ctx.lineJoin = 'round';
        ctx.stroke(p);
      } else ctx.fill(p);
    }, o);
  };

  // ---- straight screens -------------------------------------------------------------------------

  // Deck.pts.grid({ x, y, cols, rows, dx, dy = dx, r, c, order = 'cols' }) -> cols * rows points.
  // (x, y) is the centre of the top-left dot. Points carry col and row.
  pts.grid = function (opts) {
    const o = Object.assign({ x: 0, y: 0, cols: 64, rows: 64, dx: 8, r: 2, c: Deck.K, order: 'cols' }, opts);
    const dy = o.dy == null ? o.dx : o.dy, out = [];
    const put = (col, row) => out.push({ x: o.x + col * o.dx, y: o.y + row * dy, r: o.r, c: o.c, col, row });
    if (o.order === 'rows') for (let row = 0; row < o.rows; row++) for (let col = 0; col < o.cols; col++) put(col, row);
    else for (let col = 0; col < o.cols; col++) for (let row = 0; row < o.rows; row++) put(col, row);
    return out;
  };

  // Deck.pts.along(poly, n, { r, c }) -> n points evenly spaced along a polyline [[x, y], ...].
  // Points carry u = 0..1 along the line.
  pts.along = function (poly, n, opts) {
    const o = Object.assign({ r: 1.6, c: Deck.K }, opts);
    const seg = [0];
    for (let i = 1; i < poly.length; i++) seg.push(seg[i - 1] + Math.hypot(poly[i][0] - poly[i - 1][0], poly[i][1] - poly[i - 1][1]));
    const total = seg[seg.length - 1], out = [];
    let k = 1;
    for (let i = 0; i < n; i++) {
      const u = n === 1 ? 0.5 : i / (n - 1), d = u * total;
      while (k < seg.length - 1 && seg[k] < d) k++;
      const f = seg[k] === seg[k - 1] ? 0 : (d - seg[k - 1]) / (seg[k] - seg[k - 1]);
      out.push({ x: Deck.lerp(poly[k - 1][0], poly[k][0], f), y: Deck.lerp(poly[k - 1][1], poly[k][1], f), r: o.r, c: o.c, u });
    }
    return out;
  };

  pts.line = (x1, y1, x2, y2, n, opts) => pts.along([[x1, y1], [x2, y2]], n, opts);

  // ---- the token strip ----------------------------------------------------------------------------

  // One fixed row along the lower third: 64 tokens, 64 dots each (4 columns x 16 rows).
  // States 2-5 end on it, state 6 merges four of them. Do not restyle it.
  const S = (Deck.STRIP = { tokens: 64, per: 64, cols: 4, rows: 16, pitch: 3.6, r: 1.3, x: Deck.MARGIN, y: 540, w: W - 2 * Deck.MARGIN });
  S.period = (S.w - (S.cols - 1) * S.pitch) / (S.tokens - 1); // token to token, about 18.1 px
  S.h = (S.rows - 1) * S.pitch; // 54 px from the top row to the bottom row
  S.cy = S.y + S.h / 2;

  // Deck.pts.strip({ from = 0, tokens = 64, c, y }) -> 64 points per token, token by token, left to right.
  // Points carry tok (0..63), col (0..3), row (0..15). `c` may be an ink id or a function (tok) -> ink id.
  pts.strip = function (opts) {
    const o = Object.assign({ from: 0, tokens: S.tokens, c: Deck.K, y: S.y }, opts);
    const out = [];
    for (let tok = o.from; tok < o.from + o.tokens && tok < S.tokens; tok++) {
      const c = typeof o.c === 'function' ? o.c(tok) : o.c;
      for (let col = 0; col < S.cols; col++)
        for (let row = 0; row < S.rows; row++)
          out.push({ x: S.x + tok * S.period + col * S.pitch, y: o.y + row * S.pitch, r: S.r, c, tok, col, row });
    }
    return out;
  };

  // Where token `tok` sits: { x0, x1, cx, y0, y1, cy } (for a label above one token).
  pts.stripToken = function (tok) {
    const x0 = S.x + tok * S.period, x1 = x0 + (S.cols - 1) * S.pitch;
    return { x0, x1, cx: (x0 + x1) / 2, y0: S.y, y1: S.y + S.h, cy: S.cy };
  };

  // ---- the reserve --------------------------------------------------------------------------------

  // Deck.pts.reserve(k) -> k parked dots: a fine dotted rule along the top edge, filled from the left.
  // Deck.layout() parks unused dots here by itself. Keep it under about 800 dots (two rows);
  // when more are left over, enlarge the form or park them in the strip instead.
  pts.reserve = function (k) {
    const pitch = 3, perRow = Math.floor((W - 2 * Deck.MARGIN) / pitch) + 1, out = [];
    for (let i = 0; i < k; i++) {
      const row = i % 2, col = Math.floor(i / 2) % perRow, deep = Math.floor(i / 2 / perRow);
      out.push({ x: Deck.MARGIN + col * pitch, y: 20 + (row + deep * 2) * pitch, r: 0.9, c: Deck.K });
    }
    return out;
  };

  // The placeholder for a state nobody has registered yet: the dots form its number.
  pts.number = function (n) {
    return pts.text(String(n), { x: W / 2, y: 520, size: 460, align: 'center', count: N });
  };

  // ---- layout ---------------------------------------------------------------------------------------

  // Deck.layout(points[, more points...]) -> the arrangement of all 4096 dots for one beat.
  // Concatenates its arguments in order. Fewer than 4096 points: the rest are parked in the reserve.
  // More than 4096: an error is logged and the tail is cut. Returns { x, y, r, c } typed arrays.
  Deck.layout = function () {
    let all = [];
    for (const part of arguments) if (part && part.length) all = all.concat(Array.from(part));
    if (all.length > N) {
      console.error(`[deck] layout has ${all.length} points, ${all.length - N} too many; the tail is cut`);
      all.length = N;
    }
    if (all.length < N) all = all.concat(pts.reserve(N - all.length));
    const L = { x: new Float32Array(N), y: new Float32Array(N), r: new Float32Array(N), c: new Uint8Array(N) };
    for (let i = 0; i < N; i++) {
      const p = all[i];
      L.x[i] = p.x;
      L.y[i] = p.y;
      L.r[i] = Math.max(Deck.R_MIN, p.r == null ? Deck.R_FORM : p.r);
      L.c[i] = p.c ? 1 : 0;
    }
    return L;
  };
})();

// ---- engine/20-dombra.js
// The dombra: a pear-shaped body, a long thin neck, a small head with pegs, two strings.
// It is built on its own straight screen whose rows run along the instrument, so a string is
// simply one row of the screen printed in the accent ink.
(function () {
  'use strict';
  const Deck = window.Deck;
  const smooth = (t) => { t = Deck.clamp(t, 0, 1); return t * t * (3 - 2 * t); };

  // Geometry in screen cells for a resolution of R cells along the whole instrument.
  function geometry(R, strings) {
    const g = { R, strings };
    g.B = 0.375 * R; // body length
    g.NK = 0.885 * R; // where the neck meets the head (the nut)
    g.W = 0.104 * R; // body half-width at its widest
    g.tm = 0.37; // widest point, as a share of the body length from the tail
    g.wn = strings + 0.5; // neck half-width: one ink row outside and between the strings
    g.wh = g.wn + 1.3 + strings * 0.3; // head half-width
    g.bridge = 0.2 * g.B;
    g.hole = { u: 0.6 * g.B, r: 3.3 }; // sound hole: a dark disc on the light soundboard
    g.rows = [];
    for (let k = 0; k < strings; k++) g.rows.push(2 * k - (strings - 1)); // string rows: -1, +1 for two
    // frets: nineteen ties, spaced like real frets (each a twelfth-root-of-two closer)
    g.frets = [];
    const scale = g.NK - g.bridge;
    for (let k = 1; k <= 19; k++) {
      const u = g.NK - scale * (1 - Math.pow(2, -k / 12));
      if (u > g.B + 2) g.frets.push(Math.round(u));
    }
    // pegs: one per string, alternating sides, spread along the head
    g.pegs = [];
    const per = Math.ceil(strings / 2), headLen = R - g.NK;
    for (let k = 0; k < strings; k++) {
      const side = k % 2 ? 1 : -1, n = Math.floor(k / 2);
      const q = per === 1 ? (side < 0 ? 0.36 : 0.62) : 0.22 + (0.56 * n) / (per - 1) + (side > 0 ? 0.06 : 0);
      g.pegs.push({ u: Math.round(g.NK + q * headLen), side });
    }
    return g;
  }

  // Half-width of the outline at u (cells from the tail), or -1 outside the instrument.
  function half(g, u) {
    if (u < 0 || u > g.R) return -1;
    if (u <= g.B) {
      const t = u / g.B;
      if (t <= g.tm) {
        const q = (g.tm - t) / g.tm;
        return g.W * Math.sqrt(1 - q * q); // round tail
      }
      const q = (t - g.tm) / (1 - g.tm);
      return g.wn + (g.W - g.wn) * (0.5 + 0.5 * Math.cos(Math.PI * Math.pow(q, 0.82))); // shoulder into the neck
    }
    if (u <= g.NK) return g.wn;
    const q = (u - g.NK) / (g.R - g.NK);
    const swell = g.wn + (g.wh - g.wn) * smooth(q / 0.3);
    return q > 0.78 ? swell * Math.sqrt(Math.max(0, 1 - Math.pow((q - 0.78) / 0.22, 2))) : swell;
  }

  function build(R, strings) {
    const g = geometry(R, strings), out = [];
    const vmax = Math.ceil(g.W) + 8;
    for (let u = 0; u <= Math.floor(g.R); u++) {
      const hw = half(g, u);
      const slope = (half(g, u + 0.5) - half(g, Math.max(0, u - 0.5)));
      const k = 1 / Math.sqrt(1 + slope * slope);
      for (let j = -vmax; j <= vmax; j++) {
        const d = (hw - Math.abs(j)) * k; // distance inside the outline, in cells
        const cov = Deck.clamp(d + 0.5, 0, 1);
        if (cov < 0.45) continue; // no lone dots poking out of the outline
        let part, tone, c = Deck.K, s = -1, t = 0;
        const onString = g.rows.indexOf(j);
        if (u <= g.B) {
          part = 'body';
          tone = 0.4 + 0.6 * smooth(1 - (d - 0.6) / 3.2); // dark rim, lighter soundboard
          if (Math.abs(u - g.bridge) < 0.75 && Math.abs(j) <= g.wn + 1.5) tone = 1; // bridge
        } else if (u <= g.NK) {
          part = 'neck';
          tone = Math.abs(j) > g.wn - 1 ? 0.9 : 0.5;
          if (g.frets.indexOf(u) >= 0) tone = 1;
        } else {
          part = 'head';
          tone = 0.9;
        }
        if (onString >= 0 && u >= g.bridge && u <= g.NK) {
          part = 'string';
          c = Deck.A;
          s = onString;
          t = (u - g.bridge) / (g.NK - g.bridge);
          tone = 0.92;
        } else if (part === 'body' && Math.hypot(u - g.hole.u, j) < g.hole.r) {
          tone = 1; // the sound hole
        } else if (part === 'body' && u > g.bridge && Math.abs(j) <= g.wn && hw > g.wn + 5 && tone < 1) {
          tone = 0.16; // a pale channel so the strings read over the soundboard
        }
        out.push({ u, j, cov, tone: tone * cov, c, part, s, t });
      }
    }
    // pegs: a stem and a knob
    for (const p of g.pegs) {
      const base = Math.ceil(half(g, p.u));
      for (let k = 0; k < 3; k++) out.push({ u: p.u, j: p.side * (base + k), cov: 1, tone: 0.9, c: Deck.K, part: 'peg', s: -1, t: 0 });
      for (let du = -1; du <= 1; du++)
        for (let k = 3; k < 5; k++) out.push({ u: p.u + du, j: p.side * (base + k), cov: 1, tone: 1, c: Deck.K, part: 'peg', s: -1, t: 0 });
    }
    return { g, cells: out };
  }

  // Deck.pts.dombra(opts) -> points, tail on the left, head on the right at angle 0.
  //   opts { cx = 640, cy = 360 (centre of the instrument), length = 1100 (px, tail to head tip),
  //          angle = 0 (degrees, clockwise), strings = 2, count = 4096 (exact number of points),
  //          fill = 0.43 (dot radius at full tone, as a share of the pitch) }
  // Points come tail to head and carry part ('body' | 'neck' | 'head' | 'peg' | 'string'),
  // and for string dots s (string index) and t (0 at the bridge .. 1 at the nut).
  // The result also has .pitch, .normal [nx, ny] (unit vector across the strings) and
  // .strings [{ x0, y0, x1, y1 }] (bridge end and nut end of each string).
  pts_dombra.cache = new Map();
  function pts_dombra(opts) {
    const o = Object.assign({ cx: Deck.W / 2, cy: Deck.H / 2, length: 1100, angle: 0, strings: 2, count: Deck.N, fill: 0.43 }, opts);
    const key = o.strings + ':' + o.count;
    let made = pts_dombra.cache.get(key);
    if (!made) {
      let lo = 40, hi = 600; // smallest resolution with at least `count` cells
      for (let k = 0; k < 24; k++) {
        const mid = (lo + hi) / 2;
        if (build(mid, o.strings).cells.length >= o.count) hi = mid;
        else lo = mid;
      }
      made = build(hi, o.strings);
      if (made.cells.length > o.count) {
        // drop the weakest ink dots of the outline; never a string or a peg
        const drop = made.cells.filter((c) => c.part === 'body' || c.part === 'head').sort((a, b) => a.cov - b.cov).slice(0, made.cells.length - o.count);
        const gone = new Set(drop);
        made.cells = made.cells.filter((c) => !gone.has(c));
      }
      made.cells.sort((a, b) => a.u - b.u || a.j - b.j);
      pts_dombra.cache.set(key, made);
    }
    const g = made.g, p = o.length / g.R, th = (o.angle * Math.PI) / 180, cs = Math.cos(th), sn = Math.sin(th);
    const at = (u, j) => {
      const a = (u - g.R / 2) * p, b = j * p;
      return [o.cx + a * cs - b * sn, o.cy + a * sn + b * cs];
    };
    const rmax = p * o.fill;
    const out = made.cells.map((c) => {
      const [x, y] = at(c.u, c.j);
      return { x, y, r: Math.max(Deck.R_MIN, rmax * Math.sqrt(c.tone)), c: c.c, part: c.part, s: c.s, t: c.t };
    });
    out.pitch = p;
    out.normal = [-sn, cs];
    out.strings = g.rows.map((j) => {
      const a = at(g.bridge, j), b = at(g.NK, j);
      return { x0: a[0], y0: a[1], x1: b[0], y1: b[1] };
    });
    return out;
  }
  Deck.pts.dombra = pts_dombra;

  // Deck.dombra.draw(ctx, opts) fills the silhouette (no strings) into a canvas context, for
  // Deck.pts.mask when a state wants the dombra on another screen. Same opts as Deck.pts.dombra.
  Deck.dombra = {
    draw(ctx, opts) {
      const o = Object.assign({ cx: Deck.W / 2, cy: Deck.H / 2, length: 1100, angle: 0, strings: 2 }, opts);
      const g = geometry(232, o.strings), p = o.length / g.R;
      ctx.save();
      ctx.translate(o.cx, o.cy);
      ctx.rotate((o.angle * Math.PI) / 180);
      ctx.beginPath();
      const top = [], bottom = [];
      for (let u = 0; u <= g.R; u += 0.5) {
        const hw = half(g, u) * p, x = (u - g.R / 2) * p;
        top.push([x, -hw]);
        bottom.unshift([x, hw]);
      }
      top.concat(bottom).forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.closePath();
      ctx.fill();
      for (const peg of g.pegs) {
        const base = half(g, peg.u) * p, x = (peg.u - g.R / 2) * p;
        ctx.fillRect(x - p / 2, peg.side > 0 ? base : -base - 3 * p, p, 3 * p);
        ctx.fillRect(x - 1.5 * p, peg.side > 0 ? base + 3 * p : -base - 5 * p, 3 * p, 2 * p);
      }
      ctx.restore();
    },
  };

  // Deck.wobble(spec) -> a live(t, frame) function that makes string dots vibrate and die away.
  //   spec { idx (dot indices), t (matching positions 0..1 along the string), normal [nx, ny],
  //          amp = 5 (px), hz = 11, decay = 0.9 (s), mode = 1 }
  // The motion is a slowed picture of the string, not its real frequency. Returns false when it
  // has died away, so the scene settles completely.
  Deck.wobble = function (spec) {
    const o = Object.assign({ amp: 5, hz: 11, decay: 0.9, mode: 1, normal: [0, 1] }, spec);
    return function (t, frame) {
      const env = Math.exp(-t / o.decay);
      if (env < 0.02) return false;
      const a = o.amp * env * Math.cos(2 * Math.PI * o.hz * t);
      for (let k = 0; k < o.idx.length; k++) {
        const i = o.idx[k], d = a * Math.sin(Math.PI * o.mode * o.t[k]);
        frame.x[i] += o.normal[0] * d;
        frame.y[i] += o.normal[1] * d;
      }
      return true;
    };
  };
})();

// ---- engine/30-sound.js
// Sound: a plucked string rendered to a buffer first. Visuals read the buffer, playback plays the
// same buffer, so picture and sound cannot disagree and still renders are reproducible.
// The dombra has two strings a fourth apart: D3 and G3.
(function () {
  'use strict';
  const Deck = window.Deck;
  const SR = 44100;
  const sound = (Deck.sound = {
    SR,
    NOTES: { D3: 146.83, G3: 196.0, A3: 220.0, B3: 246.94, D4: 293.66, E4: 329.63 },
    unlocked: false,
  });
  const hz = (f) => (typeof f === 'string' ? sound.NOTES[f] : f);
  const cache = new Map();

  function normalise(buf, peak) {
    let m = 0;
    for (let i = 0; i < buf.length; i++) m = Math.max(m, Math.abs(buf[i]));
    if (m > 0) for (let i = 0; i < buf.length; i++) buf[i] *= peak / m;
    return buf;
  }

  // Deck.sound.pluck(freq, opts) -> Float32Array at 44.1 kHz. `freq` is Hz or a name from NOTES.
  //   opts { dur = 2.4 s, t60 = 2.6 s (decay of the fundamental), pick = 0.22 (pluck point along
  //          the string), bright = 0.5 (0 dull .. 1 harsh), seed = 7 }
  // Karplus-Strong with a tuning allpass, a triangular pluck shape and two wooden-body resonances.
  sound.pluck = function (freq, opts) {
    const f0 = hz(freq);
    const o = Object.assign({ dur: 2.4, t60: 2.6, pick: 0.22, bright: 0.5, seed: 7 }, opts);
    const key = JSON.stringify([f0, o]);
    if (cache.has(key)) return cache.get(key);
    const n = Math.floor(o.dur * SR), dry = new Float32Array(n);
    const total = SR / f0 - 0.5; // the averaging filter below delays by half a sample
    const L = Math.floor(total - 0.1), frac = total - L, C = (1 - frac) / (1 + frac);
    const rho = Math.pow(10, -3 / (f0 * o.t60));
    // the string pulled into a triangle at the pick point, plus a little noise for the attack
    const rnd = Deck.rng(o.seed), line = new Float32Array(L), pk = Math.max(1, o.pick * L);
    let lp = 0, mean = 0;
    for (let i = 0; i < L; i++) {
      lp += 0.35 * (rnd() * 2 - 1 - lp);
      line[i] = (i < pk ? i / pk : (L - i) / (L - pk)) + o.bright * 0.5 * lp;
      mean += line[i] / L;
    }
    for (let i = 0; i < L; i++) line[i] -= mean;
    let idx = 0, prev = 0, apx = 0, apy = 0;
    for (let k = 0; k < n; k++) {
      const y = line[idx];
      const avg = rho * 0.5 * (y + prev);
      prev = y;
      const ap = C * avg + apx - C * apy;
      apx = avg;
      apy = ap;
      line[idx] = ap;
      dry[k] = y;
      idx = idx + 1 === L ? 0 : idx + 1;
    }
    // body: two resonators mixed under the string
    const out = new Float32Array(n);
    const res = [[185, 9, 0.22], [410, 12, 0.12]].map(([f, q, g]) => {
      const w = (2 * Math.PI * f) / SR, r = Math.exp(-w / (2 * q));
      return { a1: 2 * r * Math.cos(w), a2: -r * r, g: g * (1 - r), y1: 0, y2: 0 };
    });
    for (let k = 0; k < n; k++) {
      let s = dry[k];
      for (const b of res) {
        const y = dry[k] + b.a1 * b.y1 + b.a2 * b.y2;
        b.y2 = b.y1;
        b.y1 = y;
        s += b.g * y;
      }
      out[k] = s;
    }
    const fin = Math.floor(0.002 * SR), fout = Math.floor(0.12 * SR);
    for (let k = 0; k < fin; k++) out[k] *= k / fin;
    for (let k = 0; k < fout; k++) out[n - 1 - k] *= k / fout;
    normalise(out, 0.85);
    cache.set(key, out);
    return out;
  };

  // Deck.sound.mix(events, dur) -> Float32Array. events: [{ t (s), f (Hz or note name), gain = 1,
  //   string (0 or 1; a new note on the same string damps the previous one), ...pluck opts }]
  sound.mix = function (events, dur) {
    const n = Math.floor(dur * SR), out = new Float32Array(n);
    const sorted = events.slice().sort((a, b) => a.t - b.t);
    sorted.forEach((e, i) => {
      const note = sound.pluck(e.f, { dur: Math.min(3, dur), t60: e.t60 || 2.6, pick: e.pick || 0.22, bright: e.bright || 0.5, seed: e.seed || 7 + i });
      const start = Math.floor(e.t * SR);
      let end = n;
      if (e.string != null) {
        const next = sorted.slice(i + 1).find((x) => x.string === e.string);
        if (next) end = Math.min(n, Math.floor(next.t * SR) + Math.floor(0.03 * SR));
      }
      const fade = Math.floor(0.03 * SR), g = e.gain == null ? 1 : e.gain;
      for (let k = start; k < end && k - start < note.length; k++) {
        const tail = end < n ? Deck.clamp((end - k) / fade, 0, 1) : 1;
        out[k] += note[k - start] * g * tail;
      }
    });
    return normalise(out, 0.85);
  };

  // The three buffers the deck uses. All cached; all deterministic.
  sound.string = (name) => sound.pluck(name || 'D3'); // one open string
  sound.strum = function () {
    // both open strings, the way a dombra is struck
    if (!cache.has('strum')) cache.set('strum', sound.mix([{ t: 0, f: 'D3', seed: 3 }, { t: 0.028, f: 'G3', seed: 5 }], 2.6));
    return cache.get('strum');
  };
  sound.motif = function () {
    // a short pentatonic motif of our own (G A B D E over the open D string); not a named kui
    if (!cache.has('motif')) {
      const m = [[0, 'G3'], [0.3, 'A3'], [0.45, 'B3'], [0.6, 'D4'], [0.9, 'B3'], [1.05, 'A3'], [1.2, 'G3']];
      const ev = m.map(([t, f], i) => ({ t, f, string: 1, seed: 11 + i }));
      for (const t of [0, 0.6, 1.2]) ev.push({ t: t + 0.012, f: 'D3', string: 0, gain: 0.8, seed: 31 + t * 10 });
      cache.set('motif', sound.mix(ev, 3.4));
    }
    return cache.get('motif');
  };

  // ---- analysis: the same buffer, as pictures ------------------------------------------------------

  // Deck.sound.wave(buf, cols, { from = 0, to = buf.length }) -> { min, max, rms } (Float32Array(cols))
  // Sample extremes per column, the way an audio editor draws a waveform.
  sound.wave = function (buf, cols, opts) {
    const o = Object.assign({ from: 0, to: buf.length }, opts);
    const min = new Float32Array(cols), max = new Float32Array(cols), rms = new Float32Array(cols);
    const step = (o.to - o.from) / cols;
    for (let c = 0; c < cols; c++) {
      const a = Math.floor(o.from + c * step), b = Math.max(a + 1, Math.floor(o.from + (c + 1) * step));
      let lo = Infinity, hi = -Infinity, sq = 0;
      for (let k = a; k < b; k++) {
        const v = buf[k] || 0;
        if (v < lo) lo = v;
        if (v > hi) hi = v;
        sq += v * v;
      }
      min[c] = lo;
      max[c] = hi;
      rms[c] = Math.sqrt(sq / (b - a));
    }
    return { min, max, rms };
  };

  // Power at one frequency over a windowed segment (Goertzel).
  function goertzel(seg, f) {
    const k = 2 * Math.cos((2 * Math.PI * f) / SR);
    let s1 = 0, s2 = 0;
    for (let i = 0; i < seg.length; i++) {
      const s0 = seg[i] + k * s1 - s2;
      s2 = s1;
      s1 = s0;
    }
    return s1 * s1 + s2 * s2 - k * s1 * s2;
  }

  function segment(buf, centre, win) {
    const seg = new Float32Array(win), a = Math.round(centre - win / 2);
    for (let i = 0; i < win; i++) {
      const k = a + i;
      if (k >= 0 && k < buf.length) seg[i] = buf[k] * (0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (win - 1)));
    }
    return seg;
  }

  // Deck.sound.spectrogram(buf, opts) -> { cols, rows, v, freqs }
  //   opts { cols = 128, rows = 32, fmin, fmax (Hz, linear spacing, both ends included),
  //          win = 4096 (samples, Hann), from = 0, to = buf.length, floor = -54 (dB) }
  //   v is Float32Array(cols * rows), v[col * rows + row] in 0..1 (0 = floor dB or less, 1 = the
  //   loudest cell); row 0 is fmin. freqs is Float32Array(rows).
  sound.spectrogram = function (buf, opts) {
    const o = Object.assign({ cols: 128, rows: 32, fmin: 80, fmax: 2400, win: 4096, from: 0, to: buf.length, floor: -54 }, opts);
    const v = new Float32Array(o.cols * o.rows), freqs = new Float32Array(o.rows);
    for (let r = 0; r < o.rows; r++) freqs[r] = o.rows === 1 ? o.fmin : o.fmin + ((o.fmax - o.fmin) * r) / (o.rows - 1);
    let top = 1e-30;
    for (let c = 0; c < o.cols; c++) {
      const seg = segment(buf, o.from + ((c + 0.5) * (o.to - o.from)) / o.cols, o.win);
      for (let r = 0; r < o.rows; r++) {
        const p = goertzel(seg, freqs[r]);
        v[c * o.rows + r] = p;
        if (p > top) top = p;
      }
    }
    for (let i = 0; i < v.length; i++) v[i] = Deck.clamp(1 - (10 * Math.log10(v[i] / top + 1e-30)) / o.floor, 0, 1);
    return { cols: o.cols, rows: o.rows, v, freqs };
  };

  // Deck.sound.pitch(buf) -> Hz of the strongest partial between 60 and 2000 Hz (for the check).
  sound.pitch = function (buf) {
    const win = Math.min(16384, buf.length), seg = segment(buf, Math.floor(0.05 * SR) + win / 2, win);
    let best = 0, bf = 0;
    for (let f = 60; f <= 2000; f += 1) {
      const p = goertzel(seg, f);
      if (p > best) { best = p; bf = f; }
    }
    const c = bf;
    for (let f = c - 1; f <= c + 1; f += 0.05) {
      const p = goertzel(seg, f);
      if (p > best) { best = p; bf = f; }
    }
    return bf;
  };

  // ---- playback ------------------------------------------------------------------------------------------

  let ac = null, master = null, live = [];

  // Called by the engine on the first key press or tap.
  sound.unlock = function () {
    if (Deck.still) return;
    try {
      if (!ac) {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain();
        master.gain.value = Deck.muted ? 0 : 1;
        master.connect(ac.destination);
      }
      if (ac.state === 'suspended') ac.resume();
      sound.unlocked = true;
    } catch (e) {
      /* no audio device: the deck stays silent and complete */
    }
  };

  // Deck.sound.play(buf, { gain = 1, delay = 0 (s) }) -> true when the buffer was scheduled.
  // Silent before the first key press, when muted, and in ?still=1.
  sound.play = function (buf, opts) {
    const o = Object.assign({ gain: 1, delay: 0 }, opts);
    if (!ac || Deck.still) return false;
    const ab = ac.createBuffer(1, buf.length, SR);
    ab.copyToChannel(buf, 0);
    const src = ac.createBufferSource(), g = ac.createGain();
    src.buffer = ab;
    g.gain.value = o.gain;
    src.connect(g).connect(master);
    src.start(ac.currentTime + o.delay);
    live.push({ src, g });
    src.onended = () => { live = live.filter((x) => x.src !== src); };
    return true;
  };

  // Fade out whatever is sounding (the engine calls this on every navigation step).
  sound.stop = function () {
    if (!ac) return;
    for (const { src, g } of live) {
      try {
        g.gain.setTargetAtTime(0, ac.currentTime, 0.02);
        src.stop(ac.currentTime + 0.15);
      } catch (e) { /* already stopped */ }
    }
    live = [];
  };

  sound.setMuted = function (m) {
    Deck.muted = !!m;
    if (master) master.gain.setTargetAtTime(Deck.muted ? 0 : 1, ac.currentTime, 0.015);
  };
})();

// ---- engine/40-dots.js
// The dot store: 4096 dots that keep their identity for the whole deck, the transition that
// carries every dot from where it is to its new target, and the canvas painter.
(function () {
  'use strict';
  const Deck = window.Deck, N = Deck.N, TAU = Math.PI * 2;
  const arr = () => ({ x: new Float32Array(N), y: new Float32Array(N), r: new Float32Array(N), c: new Uint8Array(N) });
  const cur = arr(), from = arr(), to = arr();
  const delay = new Float32Array(N), ctrlX = new Float32Array(N), ctrlY = new Float32Array(N);
  let t0 = 0, total = 0, span = 1, moving = false, ease = Deck.ease.inOut;

  const copy = (a, b) => { b.x.set(a.x); b.y.set(a.y); b.r.set(a.r); b.c.set(a.c); };

  const dots = (Deck.dots = {
    cur, // what is drawn this frame; a beat's live() may nudge it
    to, // the settled target

    // Jump to a layout with no motion.
    set(L) {
      copy(L, to);
      copy(L, cur);
      moving = false;
    },

    // Start a transition from the drawn positions to layout L.
    //   move { ms = 1200, stagger = 'x', spread = 0.45, curl = 0.14, ease = 'inOut',
    //          dir = 0 (degrees, for 'x'), origin = [640, 360] (for 'radial') }
    //   stagger: 'x' a front sweeps across the stage along `dir`; 'radial' outward from `origin`;
    //            'index' in dot order (token by token); 'none' all together;
    //            or a function (i, fromX, fromY, toX, toY) -> 0..1.
    // Neighbours share a delay, so they leave together; every dot bows the same way (curl),
    // so the field turns like a flock; then everything lands exactly on target and stops.
    move(L, move, now) {
      const o = Object.assign({ ms: 1200, stagger: 'x', spread: 0.45, curl: 0.14, ease: 'inOut', dir: 0, origin: [Deck.W / 2, Deck.H / 2] }, move);
      copy(cur, from);
      copy(L, to);
      ease = Deck.ease[o.ease] || Deck.ease.inOut;
      const th = (o.dir * Math.PI) / 180, dx = Math.cos(th), dy = Math.sin(th);
      const key = new Float32Array(N);
      let lo = Infinity, hi = -Infinity;
      for (let i = 0; i < N; i++) {
        let k = 0;
        if (typeof o.stagger === 'function') k = o.stagger(i, from.x[i], from.y[i], to.x[i], to.y[i]);
        else if (o.stagger === 'x') k = from.x[i] * dx + from.y[i] * dy;
        else if (o.stagger === 'radial') k = Math.hypot(from.x[i] - o.origin[0], from.y[i] - o.origin[1]);
        else if (o.stagger === 'index') k = i;
        key[i] = k;
        if (k < lo) lo = k;
        if (k > hi) hi = k;
      }
      const range = hi - lo || 1, jitter = 0.05;
      total = o.ms;
      span = o.ms * (1 - o.spread - jitter);
      for (let i = 0; i < N; i++) {
        delay[i] = (((key[i] - lo) / range) * o.spread + Deck.hash(i, 9) * jitter) * o.ms;
        const mx = to.x[i] - from.x[i], my = to.y[i] - from.y[i];
        ctrlX[i] = (from.x[i] + to.x[i]) / 2 - my * o.curl;
        ctrlY[i] = (from.y[i] + to.y[i]) / 2 + mx * o.curl;
      }
      t0 = now;
      moving = true;
    },

    // Advance the transition to time `now`. Returns true while dots are still travelling.
    step(now) {
      if (!moving) return false;
      const t = now - t0;
      if (t >= total) {
        copy(to, cur);
        moving = false;
        return false;
      }
      for (let i = 0; i < N; i++) {
        const u = Deck.clamp((t - delay[i]) / span, 0, 1);
        if (u <= 0) { cur.x[i] = from.x[i]; cur.y[i] = from.y[i]; cur.r[i] = from.r[i]; cur.c[i] = from.c[i]; continue; }
        if (u >= 1) { cur.x[i] = to.x[i]; cur.y[i] = to.y[i]; cur.r[i] = to.r[i]; cur.c[i] = to.c[i]; continue; }
        const e = ease(u), a = (1 - e) * (1 - e), b = 2 * e * (1 - e), c = e * e;
        cur.x[i] = a * from.x[i] + b * ctrlX[i] + c * to.x[i];
        cur.y[i] = a * from.y[i] + b * ctrlY[i] + c * to.y[i];
        cur.r[i] = from.r[i] + (to.r[i] - from.r[i]) * e;
        cur.c[i] = e < 0.5 ? from.c[i] : to.c[i]; // inks do not blend: a dot changes ink mid-flight
      }
      return true;
    },

    // Freeze the running transition at a share p (0..1) of its duration (for mid-transition stills).
    freeze(p) {
      dots.step(t0 + Deck.clamp(p, 0, 0.999) * total);
      moving = false;
    },

    rest() { copy(to, cur); },
    get moving() { return moving; },

    // Dots that a viewer can actually see: on the stage and not shrunk away. Must stay 4096.
    count() {
      let n = 0;
      for (let i = 0; i < N; i++)
        if (cur.r[i] >= Deck.R_MIN - 1e-3 && cur.x[i] >= 0 && cur.x[i] <= Deck.W && cur.y[i] >= 0 && cur.y[i] <= Deck.H) n++;
      return n;
    },

    draw(ctx) {
      ctx.clearRect(0, 0, Deck.W, Deck.H);
      for (let ink = 0; ink < 2; ink++) {
        ctx.fillStyle = ink ? Deck.ACCENT : Deck.INK;
        ctx.beginPath();
        for (let i = 0; i < N; i++) {
          if (cur.c[i] !== ink) continue;
          const x = cur.x[i], y = cur.y[i], r = cur.r[i];
          ctx.moveTo(x + r, y);
          ctx.arc(x, y, r, 0, TAU);
        }
        ctx.fill();
      }
    },
  });
})();

// ---- engine/50-captions.js
// The caption layer: a DOM layer over the dots. Every text node sits in an element with
// data-role = headline | body | label | src | control | counter (contract with the checks).
// Positions and sizes come from DESIGN.md; a state gives words, not styles.
(function () {
  'use strict';
  const Deck = window.Deck;
  const TAGS = { live: 'считается в браузере', schema: 'схема' };
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
  // The text faces carry no arrows, so arrows are drawn: one weight, one shape, any direction.
  const ARROW = { '→': 0, '↓': 90, '←': 180, '↑': 270 };
  const arrows = (html) =>
    html.replace(/[→←↑↓]/g, (a) => `<svg class="arr" viewBox="0 0 30 20" role="img" aria-label="${a}" style="transform:rotate(${ARROW[a]}deg)"><path d="M1 10h26M19 2.5l8 7.5-8 7.5" fill="none" stroke="currentColor" stroke-width="2.6"/></svg>`);
  const html = (it) => arrows(it.html != null ? it.html : esc(it.text));

  let layer, foot, counter, shown = new Map();

  function el(role, key, build) {
    let node = shown.get(key);
    if (node) {
      node.__keep = true;
      return node;
    }
    node = document.createElement('div');
    node.dataset.role = role;
    node.__key = key;
    node.__keep = true;
    node.__fresh = true;
    build(node);
    shown.set(key, node);
    return node;
  }

  function place(node, it) {
    const s = node.style;
    if (it.x != null) {
      if (it.align === 'right') { s.right = Deck.W - it.x + 'px'; s.left = 'auto'; s.textAlign = 'right'; }
      else if (it.align === 'center') { s.left = it.x + 'px'; s.transform = 'translateX(-50%)'; s.textAlign = 'center'; }
      else s.left = it.x + 'px';
    }
    if (it.y != null) s.top = it.y + 'px';
    if (it.w) { s.width = it.w + 'px'; s.maxWidth = 'none'; }
    if (it.size) s.fontSize = Math.max(22, it.size) + 'px';
    if (it.weight) s.fontWeight = it.weight;
    if (it.mono) node.classList.add('mono');
    if (it.upright) node.classList.add('upright');
  }

  const captions = (Deck.captions = {
    init(root) {
      layer = root;
      foot = document.createElement('div');
      foot.id = 'foot';
      layer.appendChild(foot);
      counter = document.createElement('div');
      counter.dataset.role = 'counter';
      layer.appendChild(counter);
    },

    // Deck.captions.show(spec, instant): replace what is on stage with `spec`.
    // Elements whose role and words did not change stay put, without a flicker.
    //   spec {
    //     headline: 'text' | { text | html, w },
    //     body:     'text' | { text | html, x, y, w, size },      default: under the headline
    //     labels:   [{ text | html, x, y, align = 'left' | 'center' | 'right', w, size, mono, upright, weight }],
    //     figure:   { value, unit, y }                             the state's one number, large, above the strip
    //     src:      'text' | { text, v } | [{ text, v }, ...],    bottom-left; v = the V-id from facts.md
    //     tag:      'live' | 'schema' | 'any words',                honesty label, bottom-left
    //     control:  { x, y, align, build(el) }                       at most one per state
    //   }
    show(spec, instant) {
      spec = spec || {};
      for (const node of shown.values()) node.__keep = false;
      const add = (parent, node) => { if (node.__fresh) parent.appendChild(node); return node; };
      const norm = (v) => (v == null || v === '' ? null : typeof v === 'string' ? { text: v } : v);

      const h = norm(spec.headline);
      let hNode = null;
      if (h) hNode = add(layer, el('headline', 'h|' + html(h), (n) => { n.innerHTML = html(h); place(n, h); }));

      const b = norm(spec.body);
      if (b) {
        const n = add(layer, el('body', 'b|' + html(b) + '|' + (b.x || '') + '|' + (b.y || ''), (n) => { n.innerHTML = html(b); place(n, b); }));
        if (b.y == null) n.style.top = (hNode ? hNode.offsetTop + hNode.offsetHeight + 22 : 48) + 'px';
      }

      for (const it of spec.labels || [])
        add(layer, el('label', ['l', html(it), it.x, it.y, it.align, it.size].join('|'), (n) => { n.innerHTML = html(it); place(n, it); }));

      // the figure: the one number of a state, set large on the token strip, its unit beside it
      const f = spec.figure;
      if (f)
        add(layer, el('label', ['f', f.value, f.unit, f.y].join('|'), (n) => {
          n.className = 'figure';
          n.innerHTML = `<b>${esc(f.value)}</b><span>${arrows(esc(f.unit || ''))}</span>`;
          n.style.bottom = Deck.H - (f.y != null ? f.y : Deck.STRIP.y - 30) + 'px';
        }));

      const c = spec.control;
      if (c) add(layer, el('control', 'c|' + (c.key || 'control'), (n) => { place(n, c); c.build(n); }));

      // the bottom line: honesty label first, then the sources
      if (spec.tag) {
        // next to a verified figure, «схема» alone could be read as "the number is schematic"
        const words = spec.tag === 'schema' && spec.figure ? 'рисунок — схема' : TAGS[spec.tag] || spec.tag;
        foot.appendChild(el('label', 't|' + words, (n) => { n.className = 'tag'; n.innerHTML = esc(words); })); // always first
      }
      const srcs = spec.src ? (Array.isArray(spec.src) ? spec.src : [spec.src]).map(norm) : [];
      for (const s of srcs) foot.appendChild(el('src', 's|' + s.text + '|' + s.v, (n) => { n.innerHTML = html(s); n.dataset.v = s.v || ''; }));

      for (const [key, node] of shown) {
        if (node.__keep) {
          if (node.__fresh) {
            node.__fresh = false;
            if (!instant) node.animate([{ opacity: 0 }, { opacity: 0 }, { opacity: 1 }], { duration: 520, easing: 'ease-out' });
          }
          continue;
        }
        shown.delete(key);
        if (instant) node.remove();
        else {
          node.style.pointerEvents = 'none';
          node.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' }).onfinish = () => node.remove();
          if (node.parentNode === foot) node.style.position = 'absolute'; // leave the flow at once
        }
      }
    },

    // The corner counter: state number and one small dot per beat. No speaker mark for now:
    // Deck.speakerOf(n) still knows who holds the state when the names come back.
    counter(n, beat, beats) {
      let pips = '';
      if (beats > 1) for (let i = 0; i < beats; i++) pips += `<i class="${i <= beat ? 'on' : ''}"></i>`;
      counter.innerHTML =
        `<span class="mute">без звука</span><span class="pips">${pips}</span>` +
        `<span class="num">${n}/${Deck.TOTAL}</span>`;
      counter.classList.toggle('muted', Deck.muted && !Deck.still);
    },
  });
})();

// ---- engine/60-deck.js
// The deck: state registry, beats, navigation, stage scaling, the render loop and window.__deck.
(function () {
  'use strict';
  const Deck = window.Deck, { W, H, N, TOTAL } = Deck;
  const defs = {}, shared = {}, layouts = new Map();
  let canvas, ctx, stage, layer, scale = 1;
  let cur = { n: 0, beat: 0 }, ready = false, raf = 0, liveFn = null, settledAt = 0, settled = false;

  // Deck.state(n, def) registers state n (1..14). See DESIGN.md, "Engine interface".
  //   def { setup() -> s, beats: [{ layout(s), caption | caption(s), enter(s, info), live(t, frame, s), stillAt, move }] }
  Deck.state = function (n, def) {
    if (!def || !Array.isArray(def.beats) || !def.beats.length) throw new Error(`[deck] state ${n} needs at least one beat`);
    defs[n] = def;
  };
  Deck.demos = {}; // name -> def, shown with ?demo=name (engine demos, not part of the 14 states)

  function placeholder(n) {
    return {
      beats: [{ layout: () => Deck.layout(Deck.pts.number(n)), caption: { labels: [{ text: 'состояние в работе', x: Deck.MARGIN, y: 48 }] }, move: { stagger: 'x' } }],
    };
  }
  const defOf = (n) => (Deck.demo && Deck.demos[Deck.demo]) || defs[n] || (defs[n] = placeholder(n));
  const keyOf = (n) => (Deck.demo ? 'demo' : n);

  function sharedOf(n) {
    const k = keyOf(n);
    if (!(k in shared)) {
      const def = defOf(n);
      shared[k] = (def.setup && def.setup()) || {};
    }
    return shared[k];
  }

  function layoutOf(n, beat) {
    const k = keyOf(n) + ':' + beat;
    if (!layouts.has(k)) {
      const L = defOf(n).beats[beat].layout(sharedOf(n));
      if (!L || !L.x || L.x.length !== N) throw new Error(`[deck] state ${n} beat ${beat}: layout() must return Deck.layout(...)`);
      layouts.set(k, L);
    }
    return layouts.get(k);
  }

  const captionOf = (n, beat) => {
    const c = defOf(n).beats[beat].caption;
    return typeof c === 'function' ? c(sharedOf(n)) : c;
  };

  // The step before (n, beat) in presentation order, or null at the very start.
  function before(n, beat) {
    if (beat > 0) return { n, beat: beat - 1 };
    if (n > 1) return { n: n - 1, beat: defOf(n - 1).beats.length - 1 };
    return null;
  }

  function kick() {
    if (!raf) raf = requestAnimationFrame(loop);
  }

  function loop(now) {
    raf = 0;
    let active = Deck.dots.step(now);
    if (!active) {
      if (!settled) { settled = true; settledAt = now; }
      if (liveFn) {
        Deck.dots.rest();
        if (liveFn((now - settledAt) / 1000, Deck.dots.cur, sharedOf(cur.n)) === false) liveFn = null;
        else active = true;
      }
    }
    Deck.dots.draw(ctx);
    if (active) kick();
  }

  // Go to state n, beat b. opts { instant, dir (+1 forward, -1 back, 0 jump) }
  function go(n, beat, opts) {
    if (!ready) return;
    const o = Object.assign({ instant: false, dir: 0 }, opts);
    n = Deck.clamp(Math.round(n) || 1, 1, TOTAL);
    const def = defOf(n);
    beat = Deck.clamp(Math.round(beat) || 0, 0, def.beats.length - 1);
    const b = def.beats[beat], s = sharedOf(n), L = layoutOf(n, beat);
    const instant = o.instant || Deck.still || matchMedia('(prefers-reduced-motion: reduce)').matches;
    Deck.sound.stop();
    cur = { n, beat };
    settled = false;
    if (instant) Deck.dots.set(L);
    else Deck.dots.move(L, o.dir < 0 && b.moveBack ? b.moveBack : b.move, performance.now());
    Deck.captions.show(captionOf(n, beat), instant);
    Deck.captions.counter(n, beat, def.beats.length);
    liveFn = Deck.still ? null : b.live || null;
    if (Deck.still) {
      // one reproducible frame: the settled target, or the beat's chosen instant of its live motion
      if (b.live && b.stillAt != null) b.live(b.stillAt, Deck.dots.cur, s);
      Deck.dots.draw(ctx);
      settled = true;
    } else {
      if (b.enter) b.enter(s, { dir: o.dir });
      kick();
    }
    try { history.replaceState(null, '', '#' + n); } catch (e) { /* file:// in some browsers */ }
  }

  function forward() {
    const beats = defOf(cur.n).beats.length;
    if (cur.beat < beats - 1) go(cur.n, cur.beat + 1, { dir: 1 });
    else if (cur.n < TOTAL) go(cur.n + 1, 0, { dir: 1 });
  }
  function back() {
    const p = before(cur.n, cur.beat);
    if (p) go(p.n, p.beat, { dir: -1 });
  }

  function fit() {
    scale = Math.min(innerWidth / W, innerHeight / H);
    const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    stage.style.width = W * scale + 'px';
    stage.style.height = H * scale + 'px';
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    layer.style.transform = `scale(${scale})`;
    if (ready) Deck.dots.draw(ctx);
  }

  function onKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    Deck.sound.unlock();
    const inControl = e.target && e.target.closest && e.target.closest('[data-role="control"]');
    const k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || ((k === ' ' || k === 'Enter') && !inControl)) forward();
    else if (k === 'ArrowLeft' || k === 'PageUp' || (k === 'Backspace' && !inControl)) back();
    else if (k === 'Home') go(1, 0);
    else if (k === 'End') go(TOTAL, 0);
    else if (k === 'f' || k === 'F' || k === 'а' || k === 'А') {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    } else if (k === 'm' || k === 'M' || k === 'ь' || k === 'Ь') {
      Deck.sound.setMuted(!Deck.muted);
      Deck.captions.counter(cur.n, cur.beat, defOf(cur.n).beats.length);
    } else return;
    e.preventDefault();
  }

  function onTap(e) {
    Deck.sound.unlock();
    if (e.target.closest && e.target.closest('[data-role="control"], a, button, input')) return;
    if (e.clientX < innerWidth / 2) back();
    else forward();
  }

  function fromHash() {
    const m = /^#(\d+)(?:\.(\d+))?$/.exec(location.hash);
    return m ? { n: +m[1], beat: +(m[2] || 0) } : { n: 1, beat: 0 };
  }

  // The hook for checks and render tools (contract).
  window.__deck = {
    get state() { return cur.n; },
    get beat() { return cur.beat; },
    get beats() { return cur.n ? defOf(cur.n).beats.length : 0; },
    total: TOTAL,
    get settled() { return ready && settled && !Deck.dots.moving; },
    get dotCount() { return Deck.dots.count(); },
    go(n, beat) { go(n, beat || 0, { dir: 0 }); },
    // Not part of the contract: a frozen mid-transition frame for render tools. Shows the step
    // before (n, beat), starts the move into (n, beat) and stops it at share p of its duration.
    mid(n, beat, p) {
      const prev = before(n, beat || 0);
      if (!prev) return false;
      const b = defOf(n).beats[beat || 0];
      Deck.dots.set(layoutOf(prev.n, prev.beat));
      Deck.dots.move(layoutOf(n, beat || 0), b.move, 0);
      Deck.dots.freeze(p == null ? 0.5 : p);
      cur = { n, beat: beat || 0 };
      Deck.captions.show(captionOf(n, beat || 0), true);
      Deck.captions.counter(n, beat || 0, defOf(n).beats.length);
      Deck.dots.draw(ctx);
      return true;
    },
  };

  async function boot() {
    stage = document.getElementById('stage');
    canvas = document.getElementById('dots');
    layer = document.getElementById('captions');
    ctx = canvas.getContext('2d');
    Deck.captions.init(layer);
    fit();
    addEventListener('resize', fit);
    // the glyph sampler draws with the text face, so the faces must be in before the first layout
    const faces = [`900 64px "${Deck.FONT_DOTS}"`, `600 64px "${Deck.FONT_TEXT}"`, `400 24px "${Deck.FONT_TEXT}"`, `italic 400 24px "${Deck.FONT_TEXT}"`, `400 15px "${Deck.FONT_MONO}"`];
    try {
      await Promise.race([Promise.all(faces.map((f) => document.fonts.load(f, 'домбра Әә 0'))), new Promise((r) => setTimeout(r, 4000))]);
    } catch (e) { /* fall through with system faces */ }
    ready = true;
    const h = fromHash();
    go(h.n, h.beat, { instant: true });
    addEventListener('keydown', onKey);
    addEventListener('click', onTap); // the whole window: left half back, right half forward
    addEventListener('hashchange', () => {
      const t = fromHash();
      if (t.n !== cur.n) go(t.n, t.beat);
    });
  }

  Deck.boot = function () {
    if (document.readyState === 'loading') addEventListener('DOMContentLoaded', boot);
    else boot();
  };
})();

// ---- states/01-title.js
// State 1 (А). Title. Beat 0: the 4096 dots sit as a 64 x 64 square of noise.
// Beat 1 (first press): the noise settles into the word «домбра» over two strings, and a pluck sounds.
(function () {
  'use strict';
  const Deck = window.Deck, { W, N } = Deck;
  const SQ = { pitch: 7, x: 1216 - 63 * 7, y: 196 }; // the square sits right, under the headline line

  Deck.state(1, {
    setup() {
      // Beat 1. Two strings run edge to edge under the word; the word takes every other dot.
      const strings = [];
      [612, 626].forEach((y, s) => {
        for (const p of Deck.pts.line(3, y, W - 3, y, 213, { r: 2.1, c: Deck.A })) strings.push(Object.assign(p, { s, t: p.u }));
      });
      const word = Deck.pts.text('домбра', { x: 64, y: 516, fit: 1152, count: N - strings.length });
      const all = Deck.pts.sortX(word.concat(strings), 6);

      // Beat 0. Dot i keeps its ink and its column of the stage: 64 dots in a row of the order
      // above become one column of the square, shuffled top to bottom, sized like noise.
      const rnd = Deck.rng(12), noise = [];
      for (let col = 0; col < 64; col++) {
        const rows = [...Array(64).keys()];
        for (let k = 63; k > 0; k--) {
          const j = Math.floor(rnd() * (k + 1));
          [rows[k], rows[j]] = [rows[j], rows[k]];
        }
        for (let k = 0; k < 64; k++)
          noise.push({ x: SQ.x + col * SQ.pitch, y: SQ.y + rows[k] * SQ.pitch, r: 0.75 + 2.55 * Math.sqrt(rnd()), c: all[col * 64 + k].c });
      }

      const idx = [[], []], t = [[], []];
      all.forEach((p, i) => { if (p.s != null) { idx[p.s].push(i); t[p.s].push(p.t); } });
      const ring = [
        Deck.wobble({ idx: idx[0], t: t[0], amp: 7, hz: 7, decay: 0.75 }),
        Deck.wobble({ idx: idx[1], t: t[1], amp: 5, hz: 9.3, decay: 0.6 }),
      ];
      return { all, noise, ring, base: noise.map((p) => p.r) };
    },

    beats: [
      {
        layout: (s) => Deck.layout(s.noise),
        caption: caption,
        // Noise is the one thing here that may keep moving: every dot breathes at its own slow rate.
        live(time, frame, s) {
          for (let i = 0; i < N; i++) frame.r[i] = Math.max(Deck.R_MIN, s.base[i] * (1 + 0.42 * Math.sin(time * (0.6 + 1.5 * Deck.hash(i, 1)) + 6.283 * Deck.hash(i, 2))));
          return true;
        },
        move: { ms: 1200, stagger: 'x', spread: 0.4 },
      },
      {
        layout: (s) => Deck.layout(s.all),
        caption: caption,
        // letters assemble left to right; the strings land last and ring once
        move: { ms: 1400, stagger: (i, fx, fy, tx) => tx, spread: 0.5, curl: 0.2 },
        enter(s, info) {
          if (info.dir > 0) Deck.sound.play(Deck.sound.strum(), { delay: 1.3 });
        },
        live(time, frame, s) {
          const a = s.ring[0](time, frame), b = s.ring[1](time, frame);
          return a || b;
        },
      },
    ],
  });

  function caption() {
    return {
      headline: 'Мультимодальные генеративные системы',
      body: 'Семинар 12 · КазНУ · 2026',
    };
  }
})();

      // Beat 1: the same size of letter for both tokens, one gap between them, filling 64 .. 1216.
      const nWord = N - strings.length;
      const size = Deck.pts.text('домбра', { x: WORD.x, y: WORD.y, fit: WORD.fit - GAP }).size;
      const probeA = Deck.pts.text('дом', { x: WORD.x, y: WORD.y, size }).length;
      const probeB = Deck.pts.text('бра', { x: W - WORD.x, y: WORD.y, size, align: 'right' }).length;
      const nA = Math.round((nWord * probeA) / (probeA + probeB));
      const tokA = Deck.pts.text('дом', { x: WORD.x, y: WORD.y, size, count: nA });
      const tokB = Deck.pts.text('бра', { x: W - WORD.x, y: WORD.y, size, count: nWord - nA, align: 'right' });
      const split = tokA.concat(tokB); // both sorted by x already, and A lies left of B
      const b1 = [];
      const parked = new Set(parkAt);
      for (let i = 0, j = 0; i < N; i++) b1.push(parked.has(i) ? b0[i] : split[j++]);

      // Beat 2: the strip, token by token (index order = left to right, as every state expects).
      const strip = Deck.pts.strip().map((p) => (p.tok < 2 ? p : Object.assign(p, { r: Deck.R_MIN })));

      // ids sit under the descenders, centred under each token
      const bA = Deck.pts.bounds(tokA), bB = Deck.pts.bounds(tokB), descent = Math.max(bA.y1, bB.y1);
      const ids = [bA, bB].map((b, n) => ({ text: A1.tokens[n].id, x: b.cx, y: descent + 20, align: 'center', mono: true }));
      return { b0, b1, strip, ids };
    },

    beats: [
      {
        layout: (s) => Deck.layout(s.b0),
        caption: { headline: HEADLINE },
        // the strings rise into the rule from the left; the word does not move
        move: { ms: 1100, stagger: 'x', spread: 0.4, curl: 0.1 },
      },
      {
        layout: (s) => Deck.layout(s.b1),
        caption: (s) => ({
          headline: HEADLINE,
          labels: s.ids,
          src: { text: A1.src, v: A1.v },
        }),
        // the cut opens from the middle outwards: both halves step aside together
        move: { ms: 1000, stagger: 'radial', origin: [640, 440], spread: 0.3, curl: 0.04 },
      },
      {
        layout: (s) => Deck.layout(s.strip),
        caption: {
          headline: HEADLINE,
          figure: { value: A1.value, unit: A1.unit },
          tag: 'schema',
          src: { text: A1.src, v: A1.v },
        },
        // token by token, left to right, as in state 4
        move: { ms: 1300, stagger: 'index', spread: 0.55, curl: 0.06 },
      },
    ],
  });
})();

<script>
// ---- states/03-image.js
// State 3 (А). «Картинка — тоже токены».
// Beat 0: a photograph of the dombra, cropped in: the pear body with its sound hole and bridge
//         fills the lower left of a straight 56 x 56 screen, the neck runs out at the top right
//         corner, the two strings in the accent ink (the background a light even tone, so the
//         square itself is visible).
// Beat 1: a 14 x 14 grid cuts it into 196 patches of 4 x 4 dots; the patches step apart, so the
//         grid is the gaps, never a drawn line.
// Beat 2: the patches, in reading order, become 196 thin tiles in the strip band (one column of
//         16 dots per patch, each dot keeping its tone and ink): the picture unrolled into a row.
// 56 x 56 = 3136 dots; the other 960 rest in a tidy three-row rule along the top edge.
(function () {
  'use strict';
  const Deck = window.Deck, { W, N } = Deck, S = Deck.STRIP;

  // The one number of this state, fixed in spec.md: V-03, ViT (2020), 224 px image, 16 px patch.
  const A2 = { value: '196', unit: 'патчей из одной картинки', src: 'ViT, 2020: 224 px, патч 16 px', v: 'V-03' };

  const HEADLINE = 'Картинка — тоже токены';
  const P = 14, D = 4, CELLS = P * D; // 14 x 14 patches, 4 x 4 dots each
  const PITCH = 8, GAP = 5, SIDE = CELLS * PITCH; // a 448 px square; 513 px once cut
  const OUT = SIDE + (P - 1) * GAP;
  const CX = W / 2, CY = 386; // centred, as tall as the stage allows between headline and bottom line
  const BG = 0.13, FILL = 0.43; // background tone; dot radius at full tone as a share of the pitch
  const R_BG = 1.0, R_TILE = 1.9; // background and darkest dot in the row

  // The picture, in screen cells (0..56, y down), as tone 0..1 per point. The instrument lies at
  // -45 degrees: u runs along it from the tail, v across. At this angle a line of cells x + y = k
  // is exactly one diagonal of the screen, so the strings (v = +-1/sqrt 2) fall on cell centres.
  const PIC = {
    ox: 4.3, oy: 52.7, // the tail; ox + oy is a whole number, see above
    B: 58, Wb: 20, tm: 0.37, // body length, body half-width, widest point as a share of B
    wn: 2.6, // neck half-width
    rim: 1.8, board: 0.32, channel: 0.1, // dark rim, soundboard, pale channel under the strings
    neck: 0.5, neckRim: 1.0, frets: [66, 72, 78, 84],
    hole: { u: 0.6, r: 3.4 }, bridge: { u: 0.22, w: 5.5 }, sv: Math.SQRT1_2,
  };
  const ax = Math.SQRT1_2, ay = -Math.SQRT1_2, nx = -ay, ny = ax;
  function halfWidth(u) {
    const { B, Wb, tm, wn } = PIC;
    if (u < 0) return -1;
    if (u > B) return wn;
    const t = u / B;
    if (t <= tm) {
      const q = (tm - t) / tm;
      return Wb * Math.sqrt(Math.max(0, 1 - q * q)); // round tail
    }
    const q = (t - tm) / (1 - tm);
    return wn + (Wb - wn) * (0.5 + 0.5 * Math.cos(Math.PI * Math.pow(q, 0.82))); // shoulder into the neck
  }
  function toneAt(x, y) {
    const dx = x - PIC.ox, dy = y - PIC.oy, u = dx * ax + dy * ay, v = dx * nx + dy * ny;
    const h = halfWidth(u), d = h - Math.abs(v);
    if (d <= 0) return 0;
    const bu = PIC.bridge.u * PIC.B, hu = PIC.hole.u * PIC.B;
    if (Math.hypot(u - hu, v) < PIC.hole.r) return 1; // sound hole
    if (u > PIC.B) {
      if (PIC.frets.some((f) => Math.abs(u - f) < 0.5)) return 1;
      return d < PIC.neckRim ? 1 : PIC.neck;
    }
    if (d < PIC.rim) return 1;
    if (Math.abs(u - bu) < 0.6 && Math.abs(v) < PIC.bridge.w) return 1; // bridge
    if (u > bu + 0.6 && Math.abs(v) < PIC.sv + 0.9) return PIC.channel;
    return PIC.board;
  }
  // mean tone of one cell, 8 x 8 samples: edge cells print smaller, like a real halftone
  function cellTone(gx, gy) {
    let s = 0;
    for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) s += toneAt(gx + (j + 0.5) / 8, gy + (i + 0.5) / 8);
    return s / 64;
  }
  // the cells each string passes through, from the bridge out of the frame
  function stringCells() {
    const on = new Set(), bu = PIC.bridge.u * PIC.B;
    for (const sv of [-PIC.sv, PIC.sv])
      for (let u = bu; u < 140; u += 0.2) {
        const x = PIC.ox + u * ax + sv * nx, y = PIC.oy + u * ay + sv * ny;
        const gx = Math.floor(x + 1e-6), gy = Math.floor(y + 1e-6);
        if (gx >= 0 && gx < CELLS && gy >= 0 && gy < CELLS) on.add(gy * CELLS + gx);
      }
    return on;
  }

  Deck.state(3, {
    setup() {
      const x0 = CX - SIDE / 2, y0 = CY - SIDE / 2;
      const strings = stringCells();

      // Patch raster order (row of patches, patch, row inside, column inside): that is the order of
      // the strip in beat 2, so the same index order serves all three beats.
      const img = [], cut = [], row = [];
      const rmax = PITCH * FILL, rbg = rmax * Math.sqrt(BG);
      const period = S.w / (P * P - 1);
      for (let pr = 0; pr < P; pr++)
        for (let pc = 0; pc < P; pc++)
          for (let dr = 0; dr < D; dr++)
            for (let dc = 0; dc < D; dc++) {
              const gx = pc * D + dc, gy = pr * D + dr;
              const x = x0 + (gx + 0.5) * PITCH, y = y0 + (gy + 0.5) * PITCH;
              const acc = strings.has(gy * CELLS + gx), c = acc ? Deck.A : Deck.K;
              const r = rmax * Math.sqrt(acc ? 0.92 : BG + (1 - BG) * cellTone(gx, gy));
              img.push({ x, y, r, c });
              cut.push({ x: x + (pc - (P - 1) / 2) * GAP, y: y + (pr - (P - 1) / 2) * GAP, r, c });
              const k = pr * P + pc; // the patch's place in the row
              row.push({ x: S.x + k * period, y: S.y + (dr * D + dc) * S.pitch, r: R_BG + ((R_TILE - R_BG) * (r - rbg)) / (rmax - rbg), c });
            }

      // The rest rest in three full rows along the top edge, left to right.
      const spare = N - img.length, perRow = spare / 3, park = [];
      for (let i = 0; i < perRow; i++)
        for (let j = 0; j < 3; j++) park.push({ x: Deck.MARGIN + (i * S.w) / (perRow - 1), y: 16 + j * 3.6, r: 0.9, c: Deck.K });

      // Interleave the parked dots by rank, so every index range is the same share of stage width
      // in every beat: neighbours that sort by x (states 2 and 4) then flow straight up and down.
      const order = [];
      for (let i = 0, j = 0; i + j < N; ) {
        if (j >= park.length || (i < img.length && (i + 0.5) / img.length <= (j + 0.5) / park.length)) order.push([0, i++]);
        else order.push([1, j++]);
      }
      const pick = (list) => order.map(([w, k]) => (w ? park[k] : list[k]));

      // beside the cut picture, at mid-height
      const label = { text: 'каждый патч — токен', x: CX + OUT / 2 + 32, y: CY - 16 };
      return { img: pick(img), cut: pick(cut), row: pick(row), label };
    },

    beats: [
      {
        layout: (s) => Deck.layout(s.img),
        caption: { headline: HEADLINE, tag: 'live' },
        move: { ms: 1300, stagger: 'x', spread: 0.45, curl: 0.12 },
      },
      {
        layout: (s) => Deck.layout(s.cut),
        caption: (s) => ({ headline: HEADLINE, labels: [s.label], tag: 'live' }),
        // the cut opens from the centre outwards
        move: { ms: 1000, stagger: 'radial', origin: [CX, CY], spread: 0.35, curl: 0.02 },
      },
      {
        layout: (s) => Deck.layout(s.row),
        caption: {
          headline: HEADLINE,
          figure: { value: A2.value, unit: A2.unit },
          tag: 'live',
          src: { text: A2.src, v: A2.v },
        },
        // patch by patch in reading order: the top row of the picture leaves first
        move: { ms: 1400, stagger: 'index', spread: 0.6, curl: 0.05 },
      },
    ],
  });
})();

</script>
<script>
// ---- states/04-sound.js
// State 4 (А). «Звук — тоже токены». One plucked string (the open D), three pictures of the same buffer:
// beat 0 the waveform, beat 1 the spectrogram, beat 2 its columns folded into the token strip.
// The time axis never moves: left is the pluck, right is 1.2 s later, in all three beats.
(function () {
  'use strict';
  const Deck = window.Deck, { W, N } = Deck, M = Deck.MARGIN;

  // The one number of this state, fixed in spec.md ("On-screen facts, fixed"): V-06, the codec
  // frame rate from the EnCodec paper. The Gemini tokens-per-second figure (V-07) is not used
  // because two official pages disagree on it.
  const A3 = {
    value: '75',
    unit: 'кадров кодека в секунду',
    src: 'EnCodec, 2022: 24 кГц',
    v: 'V-06',
  };

  const SECONDS = 1.2;
  const WAVE = { pitch: 5, r: 1.9, axis: 338 };
  const SPEC = { cols: 128, rows: 32, pitch: 9, top: 196, rmax: 4.1 };

  Deck.state(4, {
    setup() {
      const snd = Deck.sound, buf = snd.string('D3'), to = Math.floor(SECONDS * snd.SR);

      // Beat 0: the waveform as an audio editor draws it. One column of dots per 5 px of time,
      // as many dots above and below the axis as the loudest sample there calls for.
      const cols = Math.floor((W - 2 * M) / WAVE.pitch) + 1, w = snd.wave(buf, cols, { to });
      const count = (scale) => {
        let n = 0;
        for (let c = 0; c < cols; c++) n += Math.max(1, Math.round(w.max[c] * scale)) + Math.max(1, Math.round(-w.min[c] * scale));
        return n;
      };
      let lo = 1, hi = 400;
      for (let k = 0; k < 40; k++) {
        const mid = (lo + hi) / 2;
        if (count(mid) > N) hi = mid;
        else lo = mid;
      }
      const up = [], down = [];
      for (let c = 0; c < cols; c++) {
        up.push(Math.max(1, Math.round(w.max[c] * lo)));
        down.push(Math.max(1, Math.round(-w.min[c] * lo)));
      }
      // rounding leaves a few dots over: they go to the loudest columns, one each
      const loud = [...Array(cols).keys()].sort((a, b) => up[b] + down[b] - up[a] - down[a]);
      for (let k = 0, left = N - count(lo); left > 0; k++, left--) up[loud[k % cols]]++;
      const wave = [];
      for (let c = 0; c < cols; c++)
        for (let m = -up[c]; m < down[c]; m++) wave.push({ x: M + c * WAVE.pitch, y: WAVE.axis + (m + 0.5) * WAVE.pitch, r: WAVE.r, c: Deck.K });

      // Beat 1: the spectrogram, 128 moments x 32 pitches. Rows sit at multiples of half the
      // string's frequency, so every harmonic of the note lands on its own row. Loudness is dot size.
      const f0 = snd.NOTES.D3;
      const sp = snd.spectrogram(buf, { cols: SPEC.cols, rows: SPEC.rows, fmin: f0 / 2, fmax: (f0 / 2) * SPEC.rows, win: 2048, to });
      const x0 = M + (W - 2 * M - (SPEC.cols - 1) * SPEC.pitch) / 2, spec = [];
      for (let c = 0; c < SPEC.cols; c++)
        for (let row = SPEC.rows - 1; row >= 0; row--) // top (high pitch) to bottom, like the wave columns
          spec.push({ x: x0 + c * SPEC.pitch, y: SPEC.top + (SPEC.rows - 1 - row) * SPEC.pitch, r: SPEC.rmax * Math.sqrt(sp.v[c * SPEC.rows + row]), c: row === 1 ? Deck.A : Deck.K });

      // Beat 2: two neighbouring columns of the spectrogram are 64 dots: one token of the strip.
      const strip = Deck.pts.strip();
      return { buf, wave, spec, strip, fundamentalY: SPEC.top + (SPEC.rows - 2) * SPEC.pitch, specBottom: SPEC.top + (SPEC.rows - 1) * SPEC.pitch };
    },

    beats: [
      {
        layout: (s) => Deck.layout(s.wave),
        caption: () => ({
          headline: 'Звук — тоже токены',
          labels: [
            { text: 'волна', x: W - M, y: 262, align: 'right' },
            { text: 'время →', x: W - M, y: 384, align: 'right' },
          ],
          tag: 'live',
        }),
        move: { ms: 1200, stagger: 'x', spread: 0.5, curl: 0.16 },
        enter(s, info) {
          if (info.dir > 0) Deck.sound.play(s.buf, { delay: 0.7 });
        },
      },
      {
        layout: (s) => Deck.layout(s.spec),
        caption: (s) => ({
          headline: 'Звук — тоже токены',
          labels: [
            { text: 'спектрограмма', x: W - M, y: 148, align: 'right' },
            { text: 'высота ↑', x: M, y: 148 },
            { text: 'нота ре', x: M, y: s.specBottom + 18 },
            { text: 'время →', x: W - M, y: s.specBottom + 18, align: 'right' },
          ],
          tag: 'live',
        }),
        move: { ms: 1300, stagger: 'x', spread: 0.42, curl: 0.1 },
        enter(s, info) {
          if (info.dir > 0) Deck.sound.play(s.buf, { delay: 0.5 });
        },
      },
      {
        layout: (s) => Deck.layout(s.strip),
        caption: () => ({
          headline: 'Звук — тоже токены',
          figure: { value: A3.value, unit: A3.unit }, // the takeaway sits on the strip
          tag: 'schema',
          src: { text: A3.src, v: A3.v },
        }),
        // token by token, left to right: each pair of columns drops and folds into its token
        move: { ms: 1300, stagger: 'index', spread: 0.55, curl: 0.06 },
      },
    ],
  });
})();
