<script>
// ---- states/05-video.js
// State 5 (А). «Видео — патчи во времени». Beat 0: the dombra with its D string ringing (the motion
// is the content; the pluck sounds). Beat 1: the same picture peels into four frames receding in
// depth, each frame a later moment of the string, bowed less each time. Beat 2: the frames are
// cut into patches and the patches drop into the token strip, the front frame first.
(function () {
  'use strict';
  const Deck = window.Deck, { W, N } = Deck, M = Deck.MARGIN;

  // The one number of this state, fixed in spec.md ("On-screen facts, fixed"): V-10, Gemini samples
  // video at 1 frame per second in its default processing.
  const A4 = {
    value: '1',
    unit: 'кадр в секунду берёт Gemini',
    src: 'Gemini API docs, 2026',
    v: 'V-10',
  };

  const BIG = { cx: 640, cy: 382, length: 1150 };
  // The stack, in a small perspective scene: camera distance F; frame k sits dX right, dY up and dZ
  // deeper than frame k-1. Frames are parallel to the screen, so depth shows as size. Four frames,
  // offset so that no neck crosses a body: every body outline and every string stays whole.
  const STACK = { frames: 4, F: 1500, x: 450, y: 500, length: 690, dX: 185, dY: 104, dZ: 160, gap: 1.3 };
  // The D string in each frame, in px across the strings: a damped ringing caught at four moments,
  // bowed less each time. The bow points away from the other string, so the arc never crosses it
  // and rises out of the neck into paper where the room can see it.
  const BOW = [-25, -17, -11, -6];
  const layer = new Uint8Array(N); // frame of each dot in beat 1, for the peel order

  // Frame points for a dombra sampled with `count` dots: every frame is that one picture, placed in
  // depth, with its D string bowed; dots hidden behind a nearer frame are dropped.
  function frames(count) {
    const one = Deck.pts.dombra({ cx: 0, cy: 0, length: STACK.length, count, fill: 0.4 });
    const out = [];
    for (let k = 0; k < STACK.frames; k++) {
      const f = STACK.F / (STACK.F + k * STACK.dZ);
      const cx = 640 + (STACK.x + k * STACK.dX - 640) * f, cy = 360 + (STACK.y - k * STACK.dY - 360) * f;
      out.push(one.map((p, q) => {
        let y = p.y;
        if (p.part === 'string' && p.s === 0) y += BOW[k] * Math.sin(Math.PI * p.t);
        return { x: cx + p.x * f, y: cy + y * f, r: Math.max(Deck.R_MIN, p.r * f), c: p.c, k, rank: q / one.length, pitch: one.pitch * f };
      }));
    }
    // occlusion: a dot is hidden when a dot of a nearer frame lies within `gap` of that frame's
    // pitch, which leaves a thin paper margin around every nearer frame, as with cut-out prints
    const vis = [];
    for (let k = 0; k < out.length; k++) {
      const front = out.slice(0, k);
      const hash = new Map(), cell = 12;
      for (const fr of front)
        for (const p of fr) {
          const key = Math.floor(p.x / cell) + ',' + Math.floor(p.y / cell);
          if (!hash.has(key)) hash.set(key, []);
          hash.get(key).push(p);
        }
      vis.push(out[k].filter((p) => {
        const gx = Math.floor(p.x / cell), gy = Math.floor(p.y / cell);
        for (let a = -1; a <= 1; a++)
          for (let b = -1; b <= 1; b++) {
            const list = hash.get(gx + a + ',' + (gy + b));
            if (list) for (const q of list) if (Math.hypot(q.x - p.x, q.y - p.y) < STACK.gap * q.pitch) return false;
          }
        return true;
      }));
    }
    return vis;
  }

  Deck.state(5, {
    setup() {
      const dombra = Deck.pts.dombra({ cx: BIG.cx, cy: BIG.cy, length: BIG.length });
      const idx = [], t = [];
      dombra.forEach((p, i) => { if (p.part === 'string' && p.s === 0) { idx.push(i); t.push(p.t); } });
      const ring = Deck.wobble({ idx, t, normal: dombra.normal, amp: 12, hz: 7, decay: 0.85 });

      // Beat 1. The smallest sample count whose visible dots reach 4096; the surplus goes from the
      // back of the stack, faintest dots first.
      let lo = 300, hi = 4096, vis;
      while (hi - lo > 4) {
        const mid = Math.floor((lo + hi) / 2), v = frames(mid);
        if (v.reduce((n, f) => n + f.length, 0) >= N) hi = mid;
        else lo = mid;
      }
      vis = frames(hi);
      let extra = vis.reduce((n, f) => n + f.length, 0) - N;
      for (let k = vis.length - 1; extra > 0 && k >= 0; k--) {
        const drop = new Set(vis[k].slice().sort((a, b) => a.r - b.r).slice(0, extra));
        extra -= drop.size;
        vis[k] = vis[k].filter((p) => !drop.has(p));
      }
      // Every frame is the same picture, so a dot that sits at share q along the big dombra's order
      // (tail to head) goes to the frame dot at the same share: each frame lifts off the whole
      // instrument at once, and the dots move as bodies.
      const all = [].concat(...vis).sort((a, b) => a.rank - b.rank || a.k - b.k);
      const stackL = all; // dot i (big dombra order) -> all[i]
      for (let i = 0; i < N; i++) layer[i] = all[i].k;

      // Beat 2. Frames front to back, each read left to right in slabs of 64 dots: one slab is one
      // token. Inside a slab, columns of 16 left to right meet the token's 4 columns.
      const strip = Deck.pts.strip(), stripL = new Array(N), seq = [];
      for (let k = 0; k < STACK.frames; k++) {
        const own = [];
        stackL.forEach((p, i) => { if (p.k === k) own.push(i); });
        own.sort((a, b) => stackL[a].x - stackL[b].x);
        seq.push(...own);
      }
      for (let tok = 0; tok < 64; tok++) {
        const slab = seq.slice(tok * 64, tok * 64 + 64).sort((a, b) => stackL[a].x - stackL[b].x);
        for (let col = 0; col < 4; col++) {
          const column = slab.slice(col * 16, col * 16 + 16).sort((a, b) => stackL[a].y - stackL[b].y);
          for (let row = 0; row < 16; row++) stripL[column[row]] = strip[tok * 64 + col * 16 + row];
        }
      }

      const b0 = Deck.pts.bounds(vis[0]), bN = Deck.pts.bounds(vis[vis.length - 1]);
      return { dombra, ring, stackL, stripL, b0, bN };
    },

    beats: [
      {
        layout: (s) => Deck.layout(s.dombra),
        caption: { headline: 'Видео — патчи во времени', tag: 'schema' },
        move: { ms: 1300, stagger: 'x', spread: 0.5, curl: 0.12 },
        enter(s, info) {
          if (info.dir > 0) Deck.sound.play(Deck.sound.string('D3'), { delay: 1.15 });
        },
        live: (t, frame, s) => s.ring(t, frame),
        stillAt: 1 / 7, // a full swing: the still frame shows the string bowed
      },
      {
        layout: (s) => Deck.layout(s.stackL),
        caption: (s) => ({
          headline: 'Видео — патчи во времени',
          labels: [
            { text: 'кадр', x: s.b0.x0, y: s.b0.y1 + 16 },
            { text: 'время →', x: W - M, y: s.bN.y1 + 40, align: 'right' },
          ],
          tag: 'schema',
        }),
        // the frames peel off the picture one after another, the back frame first
        move: { ms: 1400, stagger: (i) => -layer[i], spread: 0.55, curl: 0.06 },
      },
      {
        layout: (s) => Deck.layout(s.stripL),
        caption: {
          headline: 'Видео — патчи во времени',
          figure: { value: A4.value, unit: A4.unit },
          tag: 'schema',
          src: { text: A4.src, v: A4.v },
        },
        // token by token: the front frame falls into the strip first, the back frame last
        move: { ms: 1350, stagger: (i, fx, fy, tx) => tx, spread: 0.6, curl: 0.06 },
      },
    ],
  });
})();

<script>
// ---- states/06-one-space.js
// State 6 (А). «Было: конвейер. Стало: одно пространство». No number.
// Beat 0: four islands in a row, each its own small space (a pale tint) holding the same dombra in
// one модальность: the word, the picture, the wave, the frames. Pipes join them: a chain of separate
// models. Beat 1: the pipes and shores go; the islands merge into one shared space, where the four
// forms of «домбра» sit together as one neighbourhood, with two other concepts as words in dots:
// «скрипка» next to it, «верблюд» far off.
// Both beats are a «схема». The order текст, изображение, звук, видео is the order of state 7's
// matrix, which grows from here.
(function () {
  'use strict';
  const Deck = window.Deck, { W, H, N } = Deck, M = Deck.MARGIN;
  const HEAD = 'От конвейера —\nк одному пространству';
  const KINDS = ['word', 'pic', 'wave', 'frames'];

  // Beat 0: four island discs of radius RD centred on the row y = ROW, pipes in the gaps.
  const ROW = 392, RD = 120, STEP = (W - 2 * M - 2 * RD) / 3;
  const isleX = (k) => M + RD + k * STEP;
  const FORM0 = { w: 192, count: 900, word: 560 }; // picture, wave and frames on one screen; the word on a finer one
  const ISLES = 2560; // dots of the four island tints; what is left parks in the reserve
  const ISLE_R = [0.95, 1.15]; // island dot radius, centre .. shore
  // Beat 1: one shared space (a superellipse, so its corners hold the forms), the four forms close,
  // two other concepts as words in dots at the size of «домбра».
  const SPACE = { cx: 640, cy: 410, rx: 574, ry: 226, p: 3.5 };
  const FORM1 = { w: 214, word: 196, count: 860, words: 1350 }; // picture, wave, frames; the three words
  const HOME = [[300, 320], [530, 320], [302, 500], [532, 502]];
  const NEAR = { x: 768, y: 414, text: 'скрипка' }, FAR = { x: 1020, y: 552, text: 'верблюд' };
  const GROUND_R = [1.05, 1.3]; // ground dot radius, centre .. shore: the edge of the space stays visible

  // ---- drawing the four forms into a canvas (ink = alpha) ----

  // «домбра» at ink width w; `text` (another word) is set at the same font size, so all words share
  // one height
  function drawWord(ctx, cx, cy, w, text) {
    ctx.font = `900 100px "${Deck.FONT_DOTS}"`;
    let m = ctx.measureText('домбра');
    const size = (100 * w) / (m.actualBoundingBoxLeft + m.actualBoundingBoxRight);
    ctx.font = `900 ${size}px "${Deck.FONT_DOTS}"`;
    m = ctx.measureText(text || 'домбра');
    const inkW = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
    ctx.fillText(text || 'домбра', cx - inkW / 2 + m.actualBoundingBoxLeft, cy + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2);
  }

  // the silhouette, with the neck drawn a little bolder so it survives a small size
  // the silhouette, with what makes it a dombra at a small size: a bolder neck and head, a pale
  // soundboard inside a dark rim, the sound hole
  function dombra(ctx, o) {
    const erase = ctx.globalCompositeOperation !== 'source-over';
    Deck.dombra.draw(ctx, o);
    const L = o.length;
    ctx.save();
    ctx.translate(o.cx, o.cy);
    ctx.rotate((o.angle * Math.PI) / 180);
    ctx.lineWidth = Math.max(3, L * 0.026);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-0.12 * L, 0);
    ctx.lineTo(0.4 * L, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(0.445 * L, 0, 0.06 * L, 0.03 * L, 0, 0, 2 * Math.PI);
    ctx.fill();
    if (!erase) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.ellipse(-0.345 * L, 0, 0.115 * L, 0.074 * L, 0, 0, 2 * Math.PI);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(-0.27 * L, 0, Math.max(2.5, 0.017 * L), 0, 2 * Math.PI);
      ctx.fill();
    }
    ctx.restore();
  }

  const picOpts = (cx, cy, w) => ({ cx, cy, length: w / Math.cos((36 * Math.PI) / 180), angle: -36 });
  // three frames of the dombra in depth, as in state 5, front first
  const frameOpts = (cx, cy, w) => [0, 1, 2].map((k) => ({ cx: cx - w * 0.1 + k * w * 0.11, cy: cy + w * 0.15 - k * w * 0.15, length: w * 0.8 * (1 - 0.09 * k), angle: 0 }));
  const frameGap = (w) => Math.max(2.5, w * 0.024);
  const dilated = (ctx, o, gap) => {
    for (let a = 0; a < 8; a++) dombra(ctx, Object.assign({}, o, { cx: o.cx + gap * Math.cos((a * Math.PI) / 4), cy: o.cy + gap * Math.sin((a * Math.PI) / 4) }));
  };

  function drawPic(ctx, cx, cy, w) {
    dombra(ctx, picOpts(cx, cy, w));
  }

  // the D string's first 1.2 s, as its envelope column by column (the picture of state 4, small)
  let waveCache = null;
  function drawWave(ctx, cx, cy, w) {
    const snd = Deck.sound, cols = 48;
    if (!waveCache) waveCache = snd.wave(snd.string('D3'), cols, { to: Math.floor(1.2 * snd.SR) });
    const wv = waveCache, h = w * 0.82;
    let peak = 0;
    for (let c = 0; c < cols; c++) peak = Math.max(peak, wv.max[c], -wv.min[c]);
    const cw = w / cols;
    for (let c = 0; c < cols; c++) {
      const top = cy - (wv.max[c] / peak) * (h / 2), bot = cy - (wv.min[c] / peak) * (h / 2);
      ctx.fillRect(cx - w / 2 + c * cw, top, cw * 0.62, Math.max(bot - top, 2));
    }
  }

  // the frames back to front, each nearer one cut out of the ones behind with a paper margin
  function drawFrames(ctx, cx, cy, w) {
    const fr = frameOpts(cx, cy, w);
    for (let k = 2; k >= 0; k--) {
      ctx.globalCompositeOperation = 'destination-out';
      dilated(ctx, fr[k], frameGap(w));
      ctx.globalCompositeOperation = 'source-over';
      dombra(ctx, fr[k]);
    }
  }

  // The strings, one accent line per instrument from the bridge to the nut (the two strings are
  // closer than a dot at this size). A frame's string hides behind the frames in front of it.
  function strings(picAt, framesAt, w) {
    const out = [];
    const line = (o, hidden) => {
      const th = (o.angle * Math.PI) / 180, a = -0.425 * o.length, b = 0.385 * o.length, n = Math.round((b - a) / 3.3) + 1;
      for (let q = 0; q < n; q++) {
        const u = a + ((b - a) * q) / (n - 1), x = o.cx + u * Math.cos(th), y = o.cy + u * Math.sin(th);
        if (!hidden || !hidden(x, y)) out.push({ x, y, r: 1.3, c: Deck.A });
      }
    };
    line(picOpts(picAt[0], picAt[1], w));
    const fr = frameOpts(framesAt[0], framesAt[1], w), cv = document.createElement('canvas');
    cv.width = W;
    cv.height = H;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = ctx.strokeStyle = '#000';
    fr.forEach((o, k) => {
      if (k === 0) line(o);
      else {
        const img = ctx.getImageData(0, 0, W, H).data;
        line(o, (x, y) => img[(Math.round(y) * W + Math.round(x)) * 4 + 3] > 60);
      }
      dilated(ctx, o, frameGap(w));
    });
    return out;
  }

  // ink dots that sit on a string make room for it
  function withStrings(ink, str) {
    const keep = ink.filter((p) => !str.some((q) => Math.abs(q.x - p.x) < 2.8 && Math.abs(q.y - p.y) < 2.8 && Math.hypot(q.x - p.x, q.y - p.y) < 2.8));
    return keep.concat(str);
  }

  const DRAW = [drawWord, drawPic, drawWave, drawFrames];

  // ---- the ground: pin dots on a 45° screen inside a shape, clear of the figures ----

  function ground(inside, count, avoid, clearOf, rad) {
    const cell = 8, hash = new Map();
    for (const p of avoid) {
      const key = Math.floor(p.x / cell) + ',' + Math.floor(p.y / cell);
      if (!hash.has(key)) hash.set(key, []);
      hash.get(key).push(p);
    }
    const near = (x, y, d) => {
      const gx = Math.floor(x / cell), gy = Math.floor(y / cell), reach = Math.ceil(d / cell);
      for (let a = -reach; a <= reach; a++)
        for (let b = -reach; b <= reach; b++) {
          const list = hash.get(gx + a + ',' + (gy + b));
          if (list) for (const q of list) if (Math.hypot(q.x - x, q.y - y) < d) return true;
        }
      return false;
    };
    const blocked = (x, y) => clearOf.some((b) => Math.hypot((x - b.cx) / b.rx, (y - b.cy) / b.ry) < 1);
    const at = (pitch) => {
      const out = [], c = Math.SQRT1_2, reach = Math.ceil(Math.hypot(W, H) / 2 / pitch) + 1;
      for (let j = -reach; j <= reach; j++)
        for (let i = -reach; i <= reach; i++) {
          const x = W / 2 + (i - j) * c * pitch, y = H / 2 + (i + j) * c * pitch;
          const d = inside(x, y); // 0 at the centre .. 1 at the shore, or > 1 outside
          if (d > 1 || blocked(x, y) || near(x, y, Math.max(6.5, pitch * 0.75))) continue;
          out.push({ x, y, d, r: Math.max(Deck.R_MIN, rad[0] + (rad[1] - rad[0]) * d), c: Deck.K });
        }
      return out;
    };
    let lo = 3, hi = 40;
    for (let k = 0; k < 18; k++) {
      const mid = (lo + hi) / 2;
      if (at(mid).length >= count) lo = mid;
      else hi = mid;
    }
    return at(lo).sort((a, b) => a.d - b.d).slice(0, count); // the shore loses the surplus
  }

  // which of `centres` a point is closest to
  const nearest = (p, centres) => {
    let best = 0, bd = Infinity;
    centres.forEach(([x, y], k) => {
      const d = Math.hypot(p.x - x, p.y - y);
      if (d < bd) { bd = d; best = k; }
    });
    return best;
  };

  // Group-to-group assignment: source group g keeps an even share of its dots (in left-to-right
  // order) for target group g; whatever is left on either side meets in one left-to-right pool.
  function assign(src, srcGroup, dst, dstGroup, groups) {
    const out = new Array(src.length), poolS = [], poolD = [];
    for (const g of groups) {
      const a = [], b = [];
      src.forEach((p, i) => { if (srcGroup[i] === g) a.push(i); });
      dst.forEach((p, i) => { if (dstGroup[i] === g) b.push(i); });
      a.sort((i, j) => src[i].x - src[j].x || src[i].y - src[j].y);
      b.sort((i, j) => dst[i].x - dst[j].x || dst[i].y - dst[j].y);
      const n = Math.min(a.length, b.length), useA = new Set(), useB = new Set();
      for (let q = 0; q < n; q++) {
        const ia = a[Math.floor(((q + 0.5) * a.length) / n)], ib = b[Math.floor(((q + 0.5) * b.length) / n)];
        out[ia] = dst[ib];
        useA.add(ia);
        useB.add(ib);
      }
      a.forEach((i) => { if (!useA.has(i)) poolS.push(i); });
      b.forEach((i) => { if (!useB.has(i)) poolD.push(i); });
    }
    src.forEach((p, i) => { if (srcGroup[i] == null) poolS.push(i); });
    dst.forEach((p, i) => { if (dstGroup[i] == null) poolD.push(i); });
    poolS.sort((i, j) => src[i].x - src[j].x);
    poolD.sort((i, j) => dst[i].x - dst[j].x);
    poolS.forEach((i, q) => (out[i] = dst[poolD[q]]));
    return out;
  }

  Deck.state(6, {
    setup() {
      // ---- beat 0: the pipeline ----
      const forms0 = Array.from(Deck.pts.mask((ctx) => drawWord(ctx, isleX(0), ROW, FORM0.w), { count: FORM0.word, fill: 0.5 })).concat(withStrings(
        Array.from(Deck.pts.mask((ctx) => [1, 2, 3].forEach((j) => DRAW[j](ctx, isleX(j), ROW, FORM0.w)), { count: FORM0.count, fill: 0.46 })),
        strings([isleX(1), ROW], [isleX(3), ROW], FORM0.w)));
      const pipes = [];
      for (let k = 0; k < 3; k++) {
        const x0 = isleX(k) + RD + 10, x1 = isleX(k + 1) - RD - 10, n = Math.round((x1 - x0) / 4.2) + 1;
        for (const dy of [-5, 5]) pipes.push(...Deck.pts.line(x0, ROW + dy, x1, ROW + dy, n, { r: 1.5 }));
      }
      const isles = ground((x, y) => {
        let d = Infinity;
        for (let k = 0; k < 4; k++) d = Math.min(d, Math.hypot(x - isleX(k), y - ROW) / RD);
        return d;
      }, Math.min(ISLES, N - forms0.length - pipes.length), forms0, [], ISLE_R);
      const centres0 = KINDS.map((k, j) => [isleX(j), ROW]);
      const formSet0 = new Set(forms0);
      const pipeline = Deck.pts.sortX([].concat(forms0, pipes, isles), 6).concat(Deck.pts.reserve(N - forms0.length - pipes.length - isles.length));
      const group0 = pipeline.map((p) => (formSet0.has(p) ? nearest(p, centres0) : null));

      // ---- beat 1: one space ----
      const words1 = Array.from(Deck.pts.mask((ctx) => {
        drawWord(ctx, HOME[0][0], HOME[0][1], FORM1.word);
        drawWord(ctx, NEAR.x, NEAR.y, FORM1.word, NEAR.text);
        drawWord(ctx, FAR.x, FAR.y, FORM1.word, FAR.text);
      }, { count: FORM1.words, fill: 0.5 }));
      const forms1 = words1.concat(withStrings(Array.from(Deck.pts.mask((ctx) => {
        [1, 2, 3].forEach((j) => DRAW[j](ctx, HOME[j][0], HOME[j][1], FORM1.w));
      }, { count: FORM1.count, fill: 0.46 })), strings(HOME[1], HOME[3], FORM1.w)));
      const sp = SPACE.p, sea = ground((x, y) => Math.pow(Math.pow(Math.abs(x - SPACE.cx) / SPACE.rx, sp) + Math.pow(Math.abs(y - SPACE.cy) / SPACE.ry, sp), 1 / sp), N - forms1.length, forms1, [], GROUND_R);
      const space = [].concat(forms1, sea);
      const centres1 = HOME.concat([[NEAR.x, NEAR.y], [FAR.x, FAR.y]]);
      const formSet1 = new Set(forms1);
      const group1 = space.map((p) => {
        if (!formSet1.has(p)) return null;
        const k = nearest(p, centres1);
        return k < 4 ? k : null;
      });
      const spaceL = assign(pipeline, group0, space, group1, [0, 1, 2, 3]);

      return { pipeline, spaceL, rowBottom: ROW + RD };
    },

    beats: [
      {
        layout: (s) => Deck.layout(s.pipeline),
        caption: (s) => ({
          headline: HEAD,
          labels: [{ text: 'у каждой своя модель', x: W / 2, y: s.rowBottom + 28, align: 'center' }],
          tag: 'schema',
        }),
        move: { ms: 1300, stagger: 'x', spread: 0.5, curl: 0.12 },
      },
      {
        layout: (s) => Deck.layout(s.spaceL),
        caption: {
          headline: HEAD,
          tag: 'schema',
          src: { text: 'CLIP, 2021 · ImageBind, 2023 · Chameleon, 2024', v: 'V-12 V-13 V-14' },
        },
        move: { ms: 1300, stagger: 'x', spread: 0.4, curl: 0.1 },
      },
    ],
  });
})();

</script>
<script>
// ---- states/07-matrix.js
// State 7 (А). «Любой вход → любой выход». The one interactive состояние of the deck.
// Bottom right: the 4x4 capability matrix (rows = input, columns = output), each cell a tile of dots:
// native cells at full tone, pipeline cells as quiet pin-dot tiles split by a seam, the chosen cell
// in the accent (it answers). Top: the dombra converts from the chosen input form (left) to the
// chosen output form (right); the model that does it in one call is named between them. A pipeline
// cell routes through a small word in the middle (a stop through text) and says «конвейер».
// Bottom left: the count of native cells, «13 из 16» (V-15, V-16, corrected by V-16a to V-16c).
//
// Control (caption.control): the row and column words and the 16 tiles are buttons. Keyboard, by
// event.code so the Russian layout works: a digit 1-4 picks the input row, a second digit 1-4 within
// 2.5 s picks the output column (alone, the first digit keeps the current output). No deck key is used.
// Beats 0-2 preselect three cells, so a clicker alone can show a native cell, another native cell
// and a pipeline cell. Idle on beat 0 for 25 s (longer than the speaker's opening lines): a slow tour of five cells, stopped by the first input.
(function () {
  'use strict';
  const Deck = window.Deck, { W, N } = Deck, M = Deck.MARGIN;

  const HEAD = 'Любой вход → любой выход';
  const MOD = ['текст', 'изображение', 'звук', 'видео'];

  // Block C of facts.md as corrected on 2026-11-11 (V-16a, V-16b, V-16c), cell by cell (row = input, column = output). One model per native cell;
  // `note` marks the separate image models (the caveat in Block C); видео → звук is partial.
  const CELLS = [
    [{ model: 'GPT-6 Astra' }, { model: 'Nano Banana 2.1', note: 'отдельная модель' }, { model: 'Gemini 3.8 Flash TTS' }, { model: 'Gemini Omni 1.2 Flash' }],
    [{ model: 'Claude Opus 5.5' }, { model: 'GPT-Image-2.6', note: 'отдельная модель' }, { model: 'Gemini 3.8 Live' }, { model: 'Gemini Omni 1.2 Flash' }],
    [{ model: 'GPT-Transcribe' }, { pipe: true }, { model: 'GPT-Realtime-1.5' }, { pipe: true }],
    [{ model: 'Gemini 3.8 Flash' }, { model: 'Nano Banana 2.1', note: 'отдельная модель' }, { pipe: true, partial: true }, { model: 'Gemini Omni 1.2 Flash' }],
  ];
  const NATIVE = CELLS.flat().filter((d) => !d.pipe).length; // 13, counted from the table above
  const FIG = { value: String(NATIVE), unit: 'из 16', src: 'каталоги OpenAI, Google, Anthropic, ноябрь 2026', v: 'V-15 V-16' };

  // Cells as [input, output]. Beats preselect these; the idle tour walks TOUR.
  const PRESET = [[1, 0], [0, 3], [2, 1]]; // изображение → текст, текст → видео, звук → изображение (конвейер)
  const TOUR = [[0, 1], [2, 0], [2, 3], [0, 3], [3, 0]]; // [2, 3] звук → видео keeps one pipeline in the tour
  const IDLE_MS = 25000, HOLD_MS = 2600, PENDING_MS = 2500;
  // A pick: everything gathers into the input form, then streams out to the output form (through the
  // word in the middle on a pipeline). Moves of the three stages:
  const STAGE = {
    gather: { ms: 950, stagger: 'x', spread: 0.35, curl: 0.12 },
    stop: { ms: 1000, stagger: (i, fx, fy, tx) => tx, spread: 0.45, curl: 0.08 },
    fin: { ms: 1150, stagger: (i, fx, fy, tx) => tx, spread: 0.5, curl: 0.1 },
  };

  // ---- geometry ----------------------------------------------------------------------------------
  // The conversion band under the headline: input slot left, output slot right, the model between.
  const BAND = { y0: 132, y1: 378, cy: 255 };
  const SLOT_W = 432;
  const IN = { x0: M, x1: M + SLOT_W }, OUT = { x0: W - M - SLOT_W, x1: W - M };
  const MID = { cx: W / 2, w: 168 };
  // The matrix: 4 x 4 tiles of 17 x 6 dots on a straight 6.4 px screen, bottom right.
  const T = { cols: 17, rows: 6, p: 6.4, colPitch: 136, rowPitch: 48, rFull: 2.75, rPipe: 1.15, rSeam: Deck.R_MIN };
  T.w = (T.cols - 1) * T.p;
  T.h = (T.rows - 1) * T.p;
  T.x0 = W - M - 3 - 3 * T.colPitch - T.w; // first dot of the first column; the last tile ends at x 1213
  T.y0 = 636 - 3 * T.rowPitch - T.h; // the last row's dots end at y 636, clear of the counter
  const tileCx = (o) => T.x0 + o * T.colPitch + T.w / 2;
  const tileCy = (i) => T.y0 + i * T.rowPitch + T.h / 2;
  const HEADS = { rowRight: T.x0 - 12, colY: T.y0 - 48 }; // row words end here; column words sit on this top
  const CTRL = { x: T.x0 - 190, y: HEADS.colY - 4 };
  const TILE_DOTS = 16 * T.cols * T.rows; // 1632
  const C = N - TILE_DOTS; // dots for the conversion: 2464
  const MID_DOTS = 300;

  Deck.state(7, {
    setup() {
      const s = { cell: PRESET[0].slice(), pending: null, gen: 0, anim: 0, timers: [], userDrove: false, forms: new Map(), cache: new Map(), ui: null };

      // Fixed identity of the tile dots: their indices come from beat 0's left-to-right order, and
      // stay the same for every cell, so a pick only moves the conversion dots.
      const ref = tiles(null).map((p) => Object.assign({}, p, { tile: true }));
      const all = Deck.pts.sortX(ref.concat(conversion(s, PRESET[0]).fin), 6);
      s.tileIdx = new Int32Array(TILE_DOTS);
      all.forEach((p, i) => { if (p.tile) s.tileIdx[p.k] = i; });

      s.layouts = (cell) => layoutsOf(s, cell);
      bindInput(s);
      return s;
    },

    beats: PRESET.map((cell, b) => ({
      layout: (s) => s.layouts(cell).fin,
      caption: (s) => {
        // a beat (re)starts here, also in ?still=1: its preset cell, no pending digit, no running tour
        reset(s);
        s.cell = cell.slice();
        s.beat = b;
        sync(s);
        return captionOf(s, cell);
      },
      move: b === 0 ? { ms: 1300, stagger: 'x', spread: 0.45, curl: 0.12 } : { ms: 1200, stagger: (i, fx, fy, tx) => tx, spread: 0.5, curl: 0.1 },
      enter(s) {
        s.userDrove = false;
        if (b === 0) later(s, IDLE_MS, () => tour(s, 0));
        warm(s);
      },
    })),
  });

  // ---- the matrix of tiles -------------------------------------------------------------------------

  // 1632 tile points, tile by tile (k = tile * 102 + dot). `chosen` = [i, o] gets the accent.
  function tiles(chosen) {
    const out = [];
    for (let i = 0; i < 4; i++)
      for (let o = 0; o < 4; o++) {
        const d = CELLS[i][o], on = chosen && chosen[0] === i && chosen[1] === o;
        for (let col = 0; col < T.cols; col++)
          for (let row = 0; row < T.rows; row++) {
            let r = T.rFull;
            if (d.pipe) {
              // two halves with a seam: two models joined. The partial cell keeps one half at mid tone.
              const seam = col === 8;
              r = seam ? T.rSeam : d.partial && col < 8 ? 1.75 : T.rPipe;
              if (on && !seam) r += 0.45;
            }
            out.push({ x: T.x0 + o * T.colPitch + col * T.p, y: T.y0 + i * T.rowPitch + row * T.p, r, c: on ? Deck.A : Deck.K, k: out.length });
          }
      }
    return out;
  }

  // ---- the forms of the dombra ---------------------------------------------------------------------

  const slotOf = (side) => (side === 'in' ? IN : OUT);

  // The word, centred on the band. `str` is «домбра» (or «dombra» for текст → текст: a translation).
  function wordForm(str, x0, w, cy, count) {
    const probe = document.createElement('canvas').getContext('2d');
    probe.font = `900 200px "${Deck.FONT_DOTS}"`;
    const m = probe.measureText(str), k = w / (m.actualBoundingBoxLeft + m.actualBoundingBoxRight);
    const base = cy + ((m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) * 200 * k) / 200 / 2;
    return Deck.pts.text(str, { x: x0, y: base, fit: w, count });
  }

  // The picture: the dombra on its own screen, tilted to fill the slot. `tilt` flips for an edited copy.
  function imageForm(slot, count, tilt) {
    const a = tilt * 16, th = (Math.abs(a) * Math.PI) / 180;
    const length = SLOT_W / (Math.cos(th) + 0.21 * Math.sin(th));
    return Deck.pts.dombra({ cx: (slot.x0 + slot.x1) / 2, cy: BAND.cy, length, angle: a, count });
  }

  // The sound: the plucked string's first 1.2 s as a waveform (dots stacked to the sample extremes),
  // computed from the same buffer the deck plays. D3 by default, G3 for the answer of звук → звук.
  function soundForm(slot, count, note) {
    const snd = Deck.sound, buf = snd.string(note), pitch = 4, cols = Math.floor(SLOT_W / pitch) + 1;
    const wv = snd.wave(buf, cols, { to: Math.floor(1.2 * snd.SR) });
    const size = (sc) => {
      let n = 0;
      for (let c = 0; c < cols; c++) n += Math.max(1, Math.round(wv.max[c] * sc)) + Math.max(1, Math.round(-wv.min[c] * sc));
      return n;
    };
    let lo = 1, hi = 600;
    for (let k = 0; k < 40; k++) {
      const mid = (lo + hi) / 2;
      if (size(mid) > count) hi = mid;
      else lo = mid;
    }
    const up = [], down = [];
    for (let c = 0; c < cols; c++) {
      up.push(Math.max(1, Math.round(wv.max[c] * lo)));
      down.push(Math.max(1, Math.round(-wv.min[c] * lo)));
    }
    const loud = [...Array(cols).keys()].sort((a, b) => up[b] + down[b] - up[a] - down[a]);
    for (let k = 0, left = count - size(lo); left > 0; k++, left--) up[loud[k % cols]]++;
    const out = [];
    for (let c = 0; c < cols; c++)
      for (let m = -up[c]; m < down[c]; m++) out.push({ x: slot.x0 + c * pitch, y: BAND.cy + (m + 0.5) * pitch * 0.82, r: 1.55, c: Deck.K });
    return out;
  }

  // The video: the dombra in a stack of frames in depth, as in states 5 and 6 (frame 0 in front,
  // older frames behind it up and to the right, smaller, their hidden dots dropped).
  function videoForm(slot, count, flip) {
    const S = { frames: 3, F: 1400, length: 340, dX: 46, dY: flip ? -40 : 42, dZ: 260, gap: 1.3 };
    const cx = slot.x0 + 172, cy = BAND.cy + (flip ? -36 : 40);
    const make = (n) => {
      const one = Deck.pts.dombra({ cx: 0, cy: 0, length: S.length, count: n });
      const fr = [];
      for (let k = 0; k < S.frames; k++) {
        const f = S.F / (S.F + k * S.dZ), x0 = cx + k * S.dX, y0 = cy - k * S.dY;
        fr.push(one.map((p) => ({ x: x0 + p.x * f, y: y0 + p.y * f, r: Math.max(Deck.R_MIN, p.r * f), c: p.c, pitch: one.pitch * f })));
      }
      const vis = [];
      fr.forEach((pts, k) => vis.push(pts.filter((p) => !fr.slice(0, k).some((front) => front.some((q) => Math.abs(q.x - p.x) < 8 && Math.hypot(q.x - p.x, q.y - p.y) < S.gap * q.pitch)))));
      return vis;
    };
    let lo = 60, hi = count, vis;
    while (hi - lo > 2) {
      const mid = Math.floor((lo + hi) / 2);
      if (make(mid).reduce((n, v) => n + v.length, 0) >= count) hi = mid;
      else lo = mid;
    }
    vis = make(hi);
    let all = [].concat(...vis);
    all = all.sort((a, b) => a.r - b.r).slice(all.length - count); // drop the faintest surplus
    for (const p of all) delete p.pitch;
    return all;
  }

  // One form of one kind in one place, cached: masks and stacks are not cheap.
  function form(s, kind, where, count, variant) {
    const key = [kind, where, count, variant || 0].join('|');
    if (s.forms.has(key)) return s.forms.get(key);
    let pts;
    if (where === 'mid') pts = wordForm('домбра', MID.cx - MID.w / 2, MID.w, BAND.cy + 14, count);
    else {
      const slot = slotOf(where);
      if (kind === 0) pts = wordForm(variant ? 'dombra' : 'домбра', slot.x0, SLOT_W, BAND.cy, count);
      else if (kind === 1) pts = imageForm(slot, count, variant ? 1 : -1);
      else if (kind === 2) pts = soundForm(slot, count, variant ? 'G3' : 'D3');
      else pts = videoForm(slot, count, !!variant);
    }
    pts = Array.from(pts, (p) => ({ x: p.x, y: p.y, r: p.r, c: p.c }));
    s.forms.set(key, pts);
    return pts;
  }

  // ---- one cell as dots ----------------------------------------------------------------------------

  // The conversion for cell [i, o]: final points (exactly C, left to right) and, for each, where it
  // waits while the input form is gathering (g1) and, on a pipeline, at the stop in the middle (g2).
  function conversion(s, cell) {
    const [i, o] = cell, d = CELLS[i][o];
    const nMid = d.pipe ? MID_DOTS : 0, nIn = Math.floor((C - nMid) / 2), nOut = C - nMid - nIn;
    const fin = [];
    const inF = form(s, i, 'in', nIn, 0);
    const outF = form(s, o, 'out', nOut, i === o ? 1 : 0); // same модальность: a translated word, an edited picture...
    const midF = nMid ? form(s, 0, 'mid', nMid, 0) : [];
    inF.forEach((p) => fin.push(Object.assign({}, p, { g1: p, g2: p })));
    midF.forEach((p, k) => fin.push(Object.assign({}, p, { g1: inF[Math.floor((k * inF.length) / midF.length)], g2: p })));
    outF.forEach((p, k) => {
      const g1 = inF[Math.floor((k * inF.length) / outF.length)];
      fin.push(Object.assign({}, p, { g1, g2: nMid ? midF[Math.floor((k * midF.length) / outF.length)] : p }));
    });
    return { fin: Deck.pts.sortX(fin, 6), pipe: !!d.pipe };
  }

  // Full layouts for a cell: fin (settled), gather (only the input form), and stop (pipeline middle).
  function layoutsOf(s, cell) {
    const key = cell.join(',');
    if (s.cache.has(key)) return s.cache.get(key);
    const conv = conversion(s, cell);
    const build = (tilePts, pick) => {
      const out = new Array(N);
      for (const p of tilePts) out[s.tileIdx[p.k]] = p;
      let k = 0;
      for (let i = 0; i < N; i++) if (!out[i]) out[i] = pick(conv.fin[k++]);
      return Deck.layout(out);
    };
    const lit = tiles(cell), plain = tiles(null);
    const L = {
      fin: build(lit, (p) => p),
      gather: build(plain, (p) => p.g1),
      stop: conv.pipe ? build(lit, (p) => p.g2) : null,
    };
    s.cache.set(key, L);
    return L;
  }

  // Compute the forms of the tour cells while the room looks at the first picture.
  function warm(s) {
    const todo = TOUR.concat(PRESET).filter((c) => !s.cache.has(c.join(',')));
    if (Deck.still) return;
    const step = () => {
      if (!todo.length || !active()) return;
      layoutsOf(s, todo.shift());
      setTimeout(step, 60);
    };
    setTimeout(step, 1600);
  }

  // ---- captions ------------------------------------------------------------------------------------

  function captionOf(s, cell) {
    const d = CELLS[cell[0]][cell[1]];
    const labels = [{ text: 'вход → выход', x: HEADS.rowRight + 2, y: HEADS.colY + 4, align: 'right' }];
    if (!d.pipe) {
      labels.push({ text: d.model, x: MID.cx, y: d.note ? BAND.cy - 40 : BAND.cy - 18, align: 'center', upright: true });
      if (d.note) labels.push({ text: d.note, x: MID.cx, y: BAND.cy - 6, align: 'center' });
    } else {
      labels.push({ text: d.partial ? 'частично' : 'конвейер', x: MID.cx, y: BAND.cy - 78, align: 'center' });
      if (d.partial) labels.push({ text: 'звук внутри видео', x: MID.cx, y: BAND.cy + 40, align: 'center' });
    }
    return {
      headline: HEAD,
      labels,
      figure: { value: FIG.value, unit: FIG.unit, y: 636 },
      tag: 'schema',
      src: { text: FIG.src, v: FIG.v },
      control: { x: CTRL.x, y: CTRL.y, key: 'matrix', build: (el) => buildControl(s, el) },
    };
  }

  // ---- the control ---------------------------------------------------------------------------------

  // setAttribute, guarded for the Node smoke test's fake DOM
  const attr = (node, k, v) => node.setAttribute && node.setAttribute(k, v);

  function buildControl(s, el) {
    const w = W - M - CTRL.x, h = 640 - CTRL.y;
    Object.assign(el.style, { width: w + 'px', height: h + 'px' });
    attr(el, 'role', 'group');
    attr(el, 'aria-label', 'Матрица: вход → выход');
    const mk = (text, label, css, onPick) => {
      const b = document.createElement('button');
      b.type = 'button';
      if (text) b.textContent = text;
      if (label) attr(b, 'aria-label', label);
      Object.assign(b.style, { position: 'absolute' }, css);
      b.addEventListener('click', (e) => {
        touched(s);
        onPick();
        if (e.detail) b.blur(); // a mouse or tap pick leaves Space and Enter to the deck
      });
      el.appendChild(b);
      return b;
    };
    const ui = { rows: [], cols: [], tiles: [] };
    for (let i = 0; i < 4; i++)
      ui.rows.push(mk(MOD[i], 'вход: ' + MOD[i], { right: W - M - HEADS.rowRight + 'px', top: tileCy(i) - CTRL.y - 19 + 'px', padding: '6px 12px' }, () => pick(s, [i, s.cell[1]])));
    for (let o = 0; o < 4; o++)
      ui.cols.push(mk(MOD[o], 'выход: ' + MOD[o], { left: tileCx(o) - CTRL.x + 'px', top: HEADS.colY - CTRL.y + 'px', transform: 'translateX(-50%)', padding: '6px 10px' }, () => pick(s, [s.cell[0], o])));
    for (let i = 0; i < 4; i++)
      for (let o = 0; o < 4; o++) {
        const d = CELLS[i][o];
        const what = d.pipe ? (d.partial ? 'частично' : 'конвейер') : d.model;
        ui.tiles.push(mk('', `${MOD[i]} → ${MOD[o]}: ${what}`, {
          left: T.x0 + o * T.colPitch - 8 - CTRL.x + 'px', top: T.y0 + i * T.rowPitch - 8 - CTRL.y + 'px',
          width: T.w + 16 + 'px', height: T.h + 16 + 'px', padding: '0', borderRadius: '4px', background: 'none',
        }, () => pick(s, [i, o])));
      }
    s.ui = ui;
    sync(s);
  }

  // Pressed states follow the chosen cell (and a pending input digit).
  function sync(s) {
    const ui = s.ui;
    if (!ui) return;
    const inRow = s.pending != null ? s.pending : s.cell[0];
    ui.rows.forEach((b, i) => attr(b, 'aria-pressed', String(i === inRow)));
    ui.cols.forEach((b, o) => attr(b, 'aria-pressed', String(o === s.cell[1])));
    ui.tiles.forEach((b, k) => attr(b, 'aria-pressed', String(k === s.cell[0] * 4 + s.cell[1])));
  }

  // ---- picking a cell: the dombra converts ---------------------------------------------------------

  const active = () => window.__deck && window.__deck.state === 7;

  function pick(s, cell, fromTour) {
    if (!active()) return;
    if (!fromTour) {
      s.pending = null;
      clearT(s.pendingTimer);
    }
    s.cell = cell.slice();
    sync(s);
    Deck.captions.show(captionOf(s, cell), false);
    const L = layoutsOf(s, cell), gen = ++s.anim;
    const canvas = document.getElementById('dots'), ctx = canvas && canvas.getContext('2d');
    if (!ctx || matchMedia('(prefers-reduced-motion: reduce)').matches) {
      Deck.dots.set(L.fin);
      if (ctx) Deck.dots.draw(ctx);
      return;
    }
    // gather into the input form, then stream out (through the stop in the middle on a pipeline)
    const stages = [[L.gather, STAGE.gather], ...(L.stop ? [[L.stop, STAGE.stop]] : []), [L.fin, STAGE.fin]];
    const run = (k) => {
      if (k >= stages.length || gen !== s.anim || !active()) return;
      Deck.dots.move(stages[k][0], stages[k][1], performance.now());
      const tick = (now) => {
        if (gen !== s.anim || !active()) return;
        const busy = Deck.dots.step(now);
        Deck.dots.draw(ctx);
        if (busy) requestAnimationFrame(tick);
        else run(k + 1);
      };
      requestAnimationFrame(tick);
    };
    run(0);
  }

  // The idle tour: the cells of TOUR in turn, until the first input.
  function tour(s, k) {
    if (s.userDrove || !active()) return;
    pick(s, TOUR[k % TOUR.length], true);
    const stagesMs = layoutsOf(s, TOUR[k % TOUR.length]).stop ? 3100 : 2100;
    later(s, stagesMs + HOLD_MS, () => tour(s, k + 1));
  }

  // ---- timers and input ----------------------------------------------------------------------------

  // clearTimeout is guarded: the Node smoke test's fake window has setTimeout only
  const clearT = (id) => { if (id != null && typeof clearTimeout === 'function') clearTimeout(id); };

  function later(s, ms, fn) {
    if (Deck.still) return;
    const gen = s.gen;
    const id = setTimeout(() => {
      s.timers = s.timers.filter((t) => t !== id);
      if (gen === s.gen && active()) fn();
    }, ms);
    s.timers.push(id);
  }

  function reset(s) {
    s.gen++;
    s.anim++;
    s.timers.forEach(clearT);
    s.timers = [];
    s.pending = null;
    clearT(s.pendingTimer);
  }

  // The first input on this state stops the tour for good (until the state is entered again).
  function touched(s) {
    if (s.userDrove) return;
    s.userDrove = true;
    s.gen++; // drops the idle and tour timers
  }

  const DECK_KEYS = new Set(['ArrowRight', 'ArrowLeft', 'PageUp', 'PageDown', 'Space', 'Enter', 'NumpadEnter', 'Home', 'End', 'Backspace', 'KeyF', 'KeyM']);

  function bindInput(s) {
    if (Deck.still) return;
    addEventListener('keydown', (e) => {
      if (!active() || e.metaKey || e.ctrlKey || e.altKey || DECK_KEYS.has(e.code)) return;
      touched(s);
      const m = /^(?:Digit|Numpad)([1-4])$/.exec(e.code);
      if (!m) return;
      e.preventDefault();
      const k = +m[1] - 1;
      if (s.pending == null) {
        // first digit: the input row; the output follows with a second digit, or stays as it is
        s.pending = k;
        sync(s);
        clearT(s.pendingTimer);
        s.pendingTimer = setTimeout(() => {
          if (s.pending != null && active()) pick(s, [s.pending, s.cell[1]]);
        }, PENDING_MS);
      } else pick(s, [s.pending, k]);
    });
    // a tap or click inside the matrix counts as input; elsewhere it is the deck's navigation
    addEventListener('pointerdown', (e) => {
      if (active() && e.target.closest && e.target.closest('[data-role="control"]')) touched(s);
    });
  }
})();

</script>
<script>
// ---- states/08-document.js
// State 8 (Б). «Понять документ». The dots form one sheet of a document: a drawing of the dombra
// with a small table beside it, on a sheet printed as a pale dot screen (the paper of the page).
// Beat 0: the sheet, and what one such page costs a model (258 tokens, V-17).
// Beat 1: the question «Сколько струн?» gets its answer, and the two strings of the drawing take
// the accent ink: the answer points into the picture.
(function () {
  'use strict';
  const Deck = window.Deck, { N } = Deck, M = Deck.MARGIN;

  // The one number of this state, fixed in spec.md ("On-screen facts, fixed"): V-17,
  // "Each document page is equivalent to 258 tokens" (Gemini API docs, document processing).
  const D9 = { value: '258', unit: 'токенов на страницу PDF', src: 'Gemini API docs, 2026', v: 'V-17' };

  // The sheet spans the stage; the figure (beat 0) and the dialogue (beat 1) share the band under it.
  const SHEET = { x0: M, x1: Deck.W - M, y0: 140, y1: 446, pitch: 15, r: 0.9 };
  const DOMBRA = { cx: 488, cy: 293, length: 768 };
  const TABLE = { x: 930, y: 214, rowH: 26, rows: 7, colB: 1116, pitch: 3.6, r: 1.25 };

  Deck.state(8, {
    setup() {
      // The table: rows of greeked text, each a bar three dots high. Row 0 is the header, set heavier.
      // Lengths are seeded, so the table is the same in every render.
      const rnd = Deck.rng(808), table = [];
      const bar = (x, y, len, r) => {
        const cols = Math.max(2, Math.round(len / TABLE.pitch));
        for (let col = 0; col < cols; col++)
          for (let row = 0; row < 3; row++) table.push({ x: x + col * TABLE.pitch, y: y + row * TABLE.pitch, r, c: Deck.K });
      };
      for (let k = 0; k < TABLE.rows; k++) {
        const y = TABLE.y + k * TABLE.rowH, r = k === 0 ? 1.7 : TABLE.r;
        bar(TABLE.x, y, k === 0 ? 120 : 70 + 80 * rnd(), r);
        bar(TABLE.colB, y, k === 0 ? 62 : 22 + 40 * rnd(), r);
      }

      // The paper of the sheet: a pale straight screen, knocked out around the drawing and the table
      // so the content sits on clean paper, the way a halftone page keeps its line art crisp.
      const probe = Deck.pts.dombra(Object.assign({ count: 2400 }, DOMBRA));
      const busy = new Set(), cell = 8, key = (x, y) => Math.floor(x / cell) + ',' + Math.floor(y / cell);
      for (const p of probe.concat(table)) busy.add(key(p.x, p.y));
      const near = (x, y) => {
        for (let dx = -2; dx <= 2; dx++) for (let dy = -2; dy <= 2; dy++) if (busy.has(key(x + dx * cell, y + dy * cell))) return true;
        return false;
      };
      const paper = [];
      const cols = Math.floor((SHEET.x1 - SHEET.x0) / SHEET.pitch), rows = Math.floor((SHEET.y1 - SHEET.y0) / SHEET.pitch);
      const ox = SHEET.x0 + (SHEET.x1 - SHEET.x0 - cols * SHEET.pitch) / 2, oy = SHEET.y0 + (SHEET.y1 - SHEET.y0 - rows * SHEET.pitch) / 2;
      for (let i = 0; i <= cols; i++)
        for (let j = 0; j <= rows; j++) {
          const x = ox + i * SHEET.pitch, y = oy + j * SHEET.pitch;
          if (!near(x, y)) paper.push({ x, y, r: SHEET.r, c: Deck.K });
        }

      // The drawing takes every dot that is left, so nothing parks in the reserve.
      const dombra = Deck.pts.dombra(Object.assign({ count: N - paper.length - table.length }, DOMBRA));
      const page = (strings, r) =>
        Deck.pts.sortX(
          dombra
            .map((p) => (p.part === 'string' ? Object.assign({}, p, { c: strings, r: p.r * r }) : Object.assign({}, p, { c: Deck.K })))
            .concat(paper, table),
          6
        );
      return {
        plain: page(Deck.K, 1), // beat 0: the whole sheet in one ink
        answer: page(Deck.A, 1.3), // beat 1: the same dots; the strings answer
      };
    },

    beats: [
      {
        layout: (s) => Deck.layout(s.plain),
        caption: {
          headline: 'Понять документ',
          figure: { value: D9.value, unit: D9.unit, y: 612 },
          tag: 'schema',
          src: { text: D9.src, v: D9.v },
        },
        move: { ms: 1300, stagger: 'x', spread: 0.5, curl: 0.12 },
      },
      {
        layout: (s) => Deck.layout(s.answer),
        caption: {
          headline: 'Понять документ',
          labels: [
            { text: '— Сколько струн?', x: M, y: 482, size: 34, upright: true },
            { text: '— Две.', x: M, y: 532, size: 34 },
          ],
          tag: 'schema',
        },
        // the strings change ink in place; the move sweeps from the dialogue side into the drawing
        move: { ms: 1000, stagger: 'x', spread: 0.6, curl: 0 },
      },
    ],
  });
})();

</script>
<script>
// ---- states/09-voice.js
// State 9 (Б). «Говорить без паузы». A call and a response on the dombra, drawn as two waveforms on
// one time axis and played from the same buffers. The call is ink; the response is accent (it answers).
// Beat 0: the response comes through a pipeline, three hops (ASR → LLM → TTS) in a wide gap.
//         Schematic: the gap is not to scale and carries no number.
// Beat 1: one model, a gap of 320 ms on the same time axis (V-11). The response slides left as a block.
(function () {
  'use strict';
  const Deck = window.Deck, { W, N } = Deck, M = Deck.MARGIN;

  // The one number of this state, fixed in spec.md: V-11, GPT-4o's average audio response time.
  // The 2.8 s / 5.4 s pipeline figures are unverified and appear nowhere, not even as the gap width.
  const D10 = { value: '320', unit: 'мс до ответа', src: 'GPT-4o System Card, 2024', v: 'V-11', gap: 0.32 };
  const PIPE_GAP = 1.5; // s, schematic: wide enough to hear and see three hops; not a measurement

  // The waves use a slightly finer screen than state 4 (4.4 instead of 5) so that 4096 dots fit
  // two thirds of the stage at a natural height; cap is only a guard (about 170 px either side).
  const WAVE = { pitch: 4.4, r: 1.75, axis: 300, cap: 38 };
  // One hop = a small tile of the token-strip material; 3 hops = 300 dots, in beat 1 one tile of 300.
  const HOP = { cols: 10, rows: 10, pitch: 3.6, r: 1.3 };

  // Call: a short rising phrase on one string; response: a falling one. A silent note on the same
  // string damps the last pluck, so each phrase ends cleanly instead of ringing into the gap.
  const CALL = { dur: 1.0, notes: [[0, 'D3'], [0.24, 'A3'], [0.48, 'B3']], damp: 0.92 };
  const RESP = { dur: 1.3, notes: [[0, 'D4'], [0.18, 'B3'], [0.36, 'A3'], [0.62, 'G3']], damp: 1.2 };
  const phrase = (p, seed) =>
    Deck.sound.mix(p.notes.map(([t, f], i) => ({ t, f, string: 0, seed: seed + i })).concat([{ t: p.damp, f: 'D3', string: 0, gain: 0 }]), p.dur);

  Deck.state(9, {
    setup() {
      const snd = Deck.sound, call = phrase(CALL, 41), resp = phrase(RESP, 61);
      const pxs = (W - 2 * M) / (CALL.dur + PIPE_GAP + RESP.dur); // px per second, the same in both beats
      const nCall = Math.round((CALL.dur * pxs) / WAVE.pitch), nResp = Math.round((RESP.dur * pxs) / WAVE.pitch);
      const wc = snd.wave(call, nCall), wr = snd.wave(resp, nResp);

      // Dots per column: as many above and below the axis as the sample extremes call for, scaled so
      // the two waves plus the hop blocks use all 4096 dots (or the cap, whichever comes first).
      const hopDots = 3 * HOP.cols * HOP.rows, budget = N - hopDots;
      // Each side of a column may stand at most 1.25 x the mean of its neighbours (raw heights): this
      // trims the one-column spike of a pluck onset (it read as render dust) and keeps the attack.
      const NEEDLE = 1.25;
      const raw = (w, k, scale) => [Math.min(WAVE.cap, Math.max(1, Math.round(w.max[k] * scale))), Math.min(WAVE.cap, Math.max(1, Math.round(-w.min[k] * scale)))];
      const heights = (w, k, scale) => {
        const h = raw(w, k, scale), nb = [k - 1, k + 1].filter((j) => j >= 0 && j < w.max.length).map((j) => raw(w, j, scale));
        const f = nb.length > 1 ? NEEDLE : 1; // an end column has one neighbour: it may only match it
        return h.map((v, s) => Math.min(v, Math.max(1, Math.round((f * nb.reduce((a, b) => a + b[s], 0)) / nb.length))));
      };
      const count = (scale) => {
        let n = 0;
        for (const w of [wc, wr]) for (let k = 0; k < w.max.length; k++) { const [u, d] = heights(w, k, scale); n += u + d; }
        return n;
      };
      let lo = 1, hi = 400;
      for (let k = 0; k < 40; k++) { const mid = (lo + hi) / 2; if (count(mid) > budget) hi = mid; else lo = mid; }
      // rounding leaves a few dots over: they go to the loudest (capped) columns, one each (as in state 4)
      const extra = [];
      for (const [w, id] of [[wc, 0], [wr, 1]]) for (let k = 0; k < w.max.length; k++) { const [u, d] = heights(w, k, lo); extra.push({ id, k, v: u + d }); }
      extra.sort((a, b) => b.v - a.v);
      const bonus = [new Int32Array(nCall), new Int32Array(nResp)];
      for (let k = 0, left = budget - count(lo); left > 0; k++, left--) bonus[extra[k % extra.length].id][extra[k % extra.length].k]++;
      const column = (w, x0, c, add) => {
        const out = [], ext = [];
        for (let k = 0; k < w.max.length; k++) {
          const [u0, d] = heights(w, k, lo), u = u0 + add[k];
          ext.push(Math.max(u, d) * WAVE.pitch);
          for (let m = -u; m < d; m++) out.push({ x: x0 + k * WAVE.pitch, y: WAVE.axis + (m + 0.5) * WAVE.pitch, r: WAVE.r, c });
        }
        out.ext = ext; // half-height of each column in px, for placing labels clear of the dots
        return out;
      };
      const callPts = column(wc, M, Deck.K, bonus[0]);
      const respAt = (gap) => column(wr, M + (CALL.dur + gap) * pxs, Deck.A, bonus[1]);

      // Beat 0: three hops spaced across the wide gap. Beat 1: the same 300 dots as one block.
      const gapX = (gap) => [M + nCall * WAVE.pitch, M + (CALL.dur + gap) * pxs];
      const block = (cx, cols, rows, pitch) => {
        const pts = Deck.pts.grid({ x: cx - ((cols - 1) * pitch) / 2, y: WAVE.axis - ((rows - 1) * pitch) / 2, cols, rows, dx: pitch, r: HOP.r });
        return pts;
      };
      const [g0a, g0b] = gapX(PIPE_GAP), hops = [];
      for (let h = 0; h < 3; h++) hops.push(...block(g0a + ((g0b - g0a) * (h + 1)) / 4, HOP.cols, HOP.rows, HOP.pitch));
      const [g1a, g1b] = gapX(D10.gap);
      const one = block((g1a + g1b) / 2, 15, 20, HOP.pitch);

      // «одна модель» is centred over the tile, as low as the dots under it (call tail, tile, response
      // onset, with 16 px around the text) allow.
      const lbl = { w: 132, cx: (g1a + g1b) / 2 }, resp1 = respAt(D10.gap), r0 = M + (CALL.dur + D10.gap) * pxs;
      const under = (x) => x > lbl.cx - lbl.w / 2 - 16 && x < lbl.cx + lbl.w / 2 + 16;
      let tall = (20 * HOP.pitch) / 2; // the tile itself
      for (let k = 0; k < nCall; k++) if (under(M + k * WAVE.pitch)) tall = Math.max(tall, callPts.ext[k]);
      for (let k = 0; k < nResp; k++) if (under(r0 + k * WAVE.pitch)) tall = Math.max(tall, resp1.ext[k]);
      lbl.y = WAVE.axis - (tall - WAVE.pitch / 2) - WAVE.r - 17 - 30; // ext counts half a pitch past the top dot

      // Playback: the same buffers, call, then silence for the gap, then the response.
      const join = (gap) => {
        const a = Math.round(CALL.dur * snd.SR), g = Math.round(gap * snd.SR), out = new Float32Array(a + g + resp.length);
        out.set(call.subarray(0, a), 0);
        out.set(resp, a + g);
        return out;
      };

      return {
        pxs,
        pipe: { pts: callPts.concat(hops, respAt(PIPE_GAP)), buf: join(PIPE_GAP), gap: [g0a, g0b], hopIdx: callPts.length },
        one: { pts: callPts.concat(one, resp1), buf: join(D10.gap), hopIdx: callPts.length, label: lbl },
      };
    },

    beats: [
      {
        layout: (s) => Deck.layout(s.pipe.pts),
        caption: (s) => ({
          headline: 'Говорить без паузы',
          labels: [{ text: 'ASR → LLM → TTS', x: (s.pipe.gap[0] + s.pipe.gap[1]) / 2, y: WAVE.axis - 74, align: 'center' }],
          tag: 'schema',
        }),
        move: { ms: 1300, stagger: 'x', spread: 0.5, curl: 0.14 },
        enter(s, info) {
          if (info.dir > 0) Deck.sound.play(s.pipe.buf, { delay: 1.3 });
        },
        // While the room hears the silence, each hop swells in turn: the answer is passing through it.
        live: (t, frame, s) => pulse(t, frame, s.pipe.hopIdx, [0, 1, 2].map((h) => [CALL.dur + (PIPE_GAP * h) / 3, CALL.dur + (PIPE_GAP * (h + 1)) / 3]), 100),
      },
      {
        layout: (s) => Deck.layout(s.one.pts),
        caption: (s) => ({
          headline: 'Говорить без паузы',
          labels: [{ text: 'одна модель', x: s.one.label.cx, y: s.one.label.y, align: 'center' }],
          figure: { value: D10.value, unit: D10.unit, y: 622 },
          tag: 'schema',
          src: { text: D10.src, v: D10.v },
        }),
        // the response slides left as one piece; the three hops close into one tile
        move: { ms: 1100, stagger: 'none', spread: 0, curl: 0.04 },
        enter(s, info) {
          if (info.dir > 0) Deck.sound.play(s.one.buf, { delay: 1.1 });
        },
        live: (t, frame, s) => pulse(t, frame, s.one.hopIdx, [[CALL.dur, CALL.dur + D10.gap]], 300),
      },
    ],
  });

  // Swell the dots of hop h (count `per`, starting at index `from`) while t is inside its window.
  // Returns false once the last window has passed, so the scene settles completely.
  function pulse(t, frame, from, windows, per) {
    windows.forEach(([a, b], h) => {
      if (t < a || t > b) return;
      const k = Math.sin((Math.PI * (t - a)) / (b - a));
      for (let i = from + h * per; i < from + (h + 1) * per; i++) frame.r[i] *= 1 + 0.6 * k;
    });
    return t <= windows[windows.length - 1][1];
  }
})();

</script>
<script>
// ---- states/10-text-to-video.js
// State 10 (Б). «Снять по тексту». Beat 0: a short prompt set in dots. Beat 1: it becomes a clip:
// a row of video frames with the sound wave under it on one time axis. Frames and wave read the same
// pluck buffer: before the pluck the string is still and the wave is silent; the frame in which the
// string is pulled sits exactly over the peak of the wave; later frames ring as loud as the wave is.
(function () {
  'use strict';
  const Deck = window.Deck, { W, N } = Deck, M = Deck.MARGIN;

  // The one number of this state, fixed in spec.md ("On-screen facts, fixed"): V-19, the clip length
  // with native audio of Gemini Omni 1.2 Flash. No release date: it is UNVERIFIED in facts.md.
  const D11 = {
    value: '15',
    unit: 'секунд видео со звуком',
    src: 'Gemini API docs, 2026: Gemini Omni 1.2 Flash',
    v: 'V-19',
  };

  const PROMPT = ['домбра звучит', 'в степи'];
  const FR = { n: 5, cols: 27, rows: 15, pitch: 8, top: 146, pluck: 1 }; // frame k = pluck is the pulled one
  const WAVE = { pitch: 5, dy: 4, r: 1.75, axis: 376 };
  // the clip on screen: 5 frames a third of a second apart. 1.6 s puts one period of D3 in each
  // wave column, so the wave's outline stays smooth (1.0 s aliases it into a comb).
  const SECONDS = 1.6;

  Deck.state(10, {
    setup() {
      const snd = Deck.sound, SR = snd.SR;

      // ---- the time axis: x = M + time * (W - 2M) / SECONDS, shared by frames and wave ----------
      const fw = (FR.cols - 1) * FR.pitch;
      const gap = (W - 2 * M - FR.n * fw) / (FR.n - 1);
      const frameCx = (k) => M + k * (fw + gap) + fw / 2;
      const cols = Math.floor((W - 2 * M) / WAVE.pitch) + 1;
      const colT = SECONDS / cols; // seconds per wave column
      // The pluck lands where its loudest sample falls in the column under the pulled frame's centre.
      const one = snd.pluck('D3', { dur: SECONDS });
      let peak = 0;
      for (let k = 1; k < one.length; k++) if (Math.abs(one[k]) > Math.abs(one[peak])) peak = k;
      const peakCol = Math.round((frameCx(FR.pluck) - M) / WAVE.pitch);
      const tPluck = (peakCol + 0.5) * colT - peak / SR;
      const buf = snd.mix([{ t: tPluck, f: 'D3' }], SECONDS);
      // wave columns shift by under half a column so the peak column sits exactly under the frame centre
      const waveX0 = frameCx(FR.pluck) - peakCol * WAVE.pitch;
      const w = snd.wave(buf, cols, { to: Math.floor(SECONDS * SR) });
      let loudest = 0;
      for (let c = 0; c < cols; c++) if (w.max[c] - w.min[c] > w.max[loudest] - w.min[loudest]) loudest = c;
      if (loudest !== peakCol) console.warn('state 10: wave peak column', loudest, 'is not under the plucked frame', peakCol);

      // ---- frames: a close-up of the dombra where the body meets the neck, two strings across ------
      // How far the plucked string swings in frame k: the loudness of the same buffer at that moment.
      const env = (t0, t1) => {
        let m = 0;
        for (let k = Math.max(0, Math.floor(t0 * SR)); k < Math.min(buf.length, Math.floor(t1 * SR)); k++) m = Math.max(m, Math.abs(buf[k]));
        return m;
      };
      const frameT = (k) => (frameCx(k) - waveX0) / WAVE.pitch * colT + colT / 2;
      const peakEnv = env(frameT(FR.pluck) - 0.05, frameT(FR.pluck) + 0.05);
      const frames = [];
      const mid = (FR.rows - 1) / 2, cc = (FR.cols - 1) / 2, rmax = FR.pitch * 0.43, A = 3.2 * FR.pitch;
      // The picture in every frame: the whole pear of the body with its sound hole, and the neck with
      // its frets running out to the right. Tone 0..1 at column c, row j (0 = the neck's axis).
      const half = (c) => {
        if (c < -0.6) return -1;
        if (c <= 5.5) return 6.9 * Math.sqrt(Math.max(0, 1 - Math.pow((5.5 - c) / 5.9, 2))); // round tail
        if (c <= 14) return 2.1 + 4.8 * (0.5 + 0.5 * Math.cos((Math.PI * (c - 5.5)) / 8.5)); // shoulder
        return 2.1; // neck
      };
      const closeUp = (c, j) => {
        const d = half(c) - Math.abs(j); // rows inside the outline
        if (c > 14 && (c - 17) % 3 === 0 && Math.abs(j) <= 3) return 1; // frets, tied round the neck
        if (d < 0) return 0; // paper: a pin dot
        if (Math.hypot(c - 5.5, j) < 2.1 || (c === 1 && Math.abs(j) <= 2)) return 1; // sound hole, bridge
        if (c > 14 && (c === 17 || c === 20 || c === 23 || c === 26)) return 1; // frets
        return d < 0.9 ? 0.95 : c > 14 ? 0.25 : 0.4; // dark rim, neck, soundboard
      };
      for (let k = 0; k < FR.n; k++) {
        const x0 = frameCx(k) - fw / 2;
        const a = k < FR.pluck ? 0 : Deck.clamp(env(frameT(k) - 0.05, frameT(k) + 0.05) / peakEnv, 0, 1);
        const swing = (c) => {
          if (k < FR.pluck) return 0;
          if (k === FR.pluck) return -A * (1 - Math.abs(c - cc) / (cc + 1)); // pulled into a triangle
          const sign = (k - FR.pluck) % 2 ? 1 : -1; // later frames catch it on alternate sides
          return sign * A * a * Math.sin((Math.PI * (c + 1)) / (FR.cols + 1));
        };
        for (let c = 0; c < FR.cols; c++) {
          for (let row = 0; row < FR.rows; row++) {
            const j = row - mid, x = x0 + c * FR.pitch, y = FR.top + row * FR.pitch;
            if ((j === -1 || j === 1) && c >= 2) { // the strings run from the bridge (column 1) out
              frames.push({ x, y: y + (j === -1 ? swing(c) : 0), r: 0.92 * rmax * 0.9, c: Deck.A, f: k });
              continue;
            }
            frames.push({ x, y, r: Math.max(Deck.R_MIN, rmax * Math.sqrt(closeUp(c, j))), c: Deck.K, f: k });
          }
        }
      }

      // ---- the wave: dots stacked to the sample extremes, the way state 4 draws it ---------------
      const budget = N - frames.length;
      const count = (scale) => {
        let n = 0;
        for (let c = 0; c < cols; c++) n += Math.max(1, Math.round(w.max[c] * scale)) + Math.max(1, Math.round(-w.min[c] * scale));
        return n;
      };
      let lo = 1, hi = 400;
      for (let k = 0; k < 40; k++) {
        const m = (lo + hi) / 2;
        if (count(m) > budget) hi = m;
        else lo = m;
      }
      const up = [], down = [];
      for (let c = 0; c < cols; c++) {
        up.push(Math.max(1, Math.round(w.max[c] * lo)));
        down.push(Math.max(1, Math.round(-w.min[c] * lo)));
      }
      const order = [...Array(cols).keys()].sort((a, b) => up[b] + down[b] - up[a] - down[a]);
      for (let k = 0, left = budget - count(lo); left > 0; k++, left--) (k % 2 ? down : up)[order[Math.floor(k / 2) % cols]]++;
      const wave = [];
      for (let c = 0; c < cols; c++)
        for (let m = -up[c]; m < down[c]; m++) wave.push({ x: waveX0 + c * WAVE.pitch, y: WAVE.axis + (m + 0.5) * WAVE.dy, r: WAVE.r, c: Deck.K });
      const clip = Deck.pts.sortX(frames.concat(wave), 6);
      const waveTop = WAVE.axis - Math.max(...up) * WAVE.dy;

      // ---- the prompt: two lines of Literata Black and a text caret, on one halftone screen -------
      const probe = document.createElement('canvas').getContext('2d');
      const font = (size) => `900 ${size}px "${Deck.FONT_DOTS}"`;
      probe.font = font(200);
      const m0 = probe.measureText(PROMPT[0]);
      const size = (200 * 1100) / (m0.actualBoundingBoxLeft + m0.actualBoundingBoxRight);
      probe.font = font(size);
      const m1 = probe.measureText(PROMPT[0]), m2 = probe.measureText(PROMPT[1]);
      const base = [352, 352 + 1.06 * size], asc = 0.74 * size, desc = 0.22 * size;
      const caretX = M + m2.actualBoundingBoxLeft + m2.actualBoundingBoxRight + 0.2 * size;
      const prompt = Deck.pts.mask((ctx) => {
        ctx.font = font(size);
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(PROMPT[0], M + m1.actualBoundingBoxLeft, base[0]);
        ctx.fillText(PROMPT[1], M + m2.actualBoundingBoxLeft, base[1]);
        ctx.fillRect(caretX, base[1] - asc, Math.max(8, 0.07 * size), asc + desc);
      }, { count: N });

      return { buf, prompt, clip, promptTop: base[0] - asc, waveTop, frameBottom: FR.top + (FR.rows - 1) * FR.pitch };
    },

    beats: [
      {
        layout: (s) => Deck.layout(s.prompt),
        caption: (s) => ({
          headline: 'Снять по тексту',
          labels: [{ text: 'промпт', x: M, y: s.promptTop - 58 }],
          tag: 'schema',
        }),
        move: { ms: 1300, stagger: 'x', spread: 0.45, curl: 0.12 },
      },
      {
        layout: (s) => Deck.layout(s.clip),
        caption: (s) => ({
          headline: 'Снять по тексту',
          labels: [
            { text: 'кадры', x: W - M, y: FR.top - 50, align: 'right' },
            { text: 'звук', x: M, y: WAVE.axis - 40 }, // over the silence before the pluck
          ],
          figure: { value: D11.value, unit: D11.unit, y: 624 },
          tag: 'schema',
          src: { text: D11.src, v: D11.v },
        }),
        // the letters fall apart left to right into frames above and sound below
        move: { ms: 1300, stagger: 'x', spread: 0.45, curl: 0.1 },
        enter(s, info) {
          if (info.dir > 0) Deck.sound.play(s.buf, { delay: 0.8 });
        },
      },
    ],
  });
})();

<script>
// ---- states/11-agent.js
// State 11 (Б). «Увидеть и сделать». Action is one more output modality.
// Beat 0: the model sees the dombra, cut into patches. Beat 1: five action tokens come out of the
// picture. Beat 2: the patches close into the real dombra and the tokens condense into one bold
// accent mark that pulls the upper string and lets go; it rings and sounds. Beat 3: everything lines
// up as the token strip with the number; the first 13 of 64 tokens are accent (13 / 64 = 20.3 %), so
// the strip is the picture of the number, and the mark's dots land in the last five of those 13.
// The number is about agents that work a computer (OSWorld), not about this pluck, and the caption
// says so.
(function () {
  'use strict';
  const Deck = window.Deck, { W, N } = Deck, M = Deck.MARGIN;

  // The one number of this state, fixed in spec.md ("On-screen facts, fixed"): V-20, OSWorld 2.0,
  // binary completion at 500 steps, best reported model.
  const D12 = {
    value: '20,6 %',
    unit: 'задач за компьютером до конца',
    src: 'OSWorld 2.0, 2026: Claude Opus 4.8',
    v: 'V-20',
  };

  const DOM = { cx: 640, cy: 380, length: 1120 };
  const PATCH = { size: 40, shrink: 0.76 }; // patch content shrinks to its centre, opening gaps
  const TOK = { n: 5, side: 8, pitch: 6, gap: 18, top: 528, r: 2.3 }; // action tokens, 64 dots each
  const T = TOK.n * TOK.side * TOK.side; // 320 dots: the tokens, then the mark, then the tokens again
  const PL = { touch: 0.2, pull: 0.42, lift: 0.75, rest: 12, amp: 20 }; // the pluck, in seconds and px
  const FIG_X = 600; // right edge of the figure «20,6 %» on the strip beat
  const MARK = { R: 20, r: 1.45, gap: 3 }; // the action mark: outer radius, dot radius, clearance over the string

  Deck.state(11, {
    setup() {
      const full = Deck.pts.dombra(Object.assign({ count: N }, DOM));
      const small = Deck.pts.dombra(Object.assign({ count: N - T }, DOM));
      const str = small.strings[0], xp = (str.x0 + str.x1) / 2, ys = (str.y0 + str.y1) / 2; // the plucked point

      // patches: every dot pulls towards the centre of its 40 px cell; the neck runs along a row centre
      const x0 = DOM.cx - DOM.length / 2;
      const patch = (p) => {
        const px = x0 + (Math.floor((p.x - x0) / PATCH.size) + 0.5) * PATCH.size;
        const py = DOM.cy + Math.round((p.y - DOM.cy) / PATCH.size) * PATCH.size;
        return Object.assign({}, p, { x: px + (p.x - px) * PATCH.shrink, y: py + (p.y - py) * PATCH.shrink, r: Math.max(Deck.R_MIN, p.r * 0.94) });
      };

      // which dots become the tokens: one dot in every thirteen of the picture, so they rise from all of it
      const isTok = new Uint8Array(N), tokIdx = [];
      for (let k = 0; k < T; k++) {
        const i = Math.floor(((k + 0.5) * N) / T);
        isTok[i] = 1;
        tokIdx.push(i);
      }

      // the action tokens: a short row under the plucked point, left to right
      const tw = (TOK.side - 1) * TOK.pitch, row = TOK.n * tw + (TOK.n - 1) * TOK.gap;
      const tx0 = xp - row / 2, tokens = [];
      for (let t = 0; t < TOK.n; t++)
        for (const p of Deck.pts.grid({ x: tx0 + t * (tw + TOK.gap), y: TOK.top, cols: TOK.side, rows: TOK.side, dx: TOK.pitch, r: TOK.r, c: Deck.A })) tokens.push(p);

      // the action: the five tokens condense into one bold accent mark just above the plucked point,
      // a plectrum reduced to a single dot (a fused sunflower cluster, far larger than any other dot)
      const markY = ys - MARK.gap - PL.rest - MARK.R; // the mark's centre at rest
      const mark = [];
      for (let j = 0; j < T; j++) {
        const rr = (MARK.R - MARK.r) * Math.sqrt((j + 0.5) / T), th = j * 2.399963;
        mark.push({ x: xp + rr * Math.cos(th), y: markY + rr * Math.sin(th), r: MARK.r, c: Deck.A });
      }
      Deck.pts.sortX(mark, 2);

      // ---- the four layouts, all indexed by dot ------------------------------------------------
      const seen = full.map(patch);
      const look = new Array(N), act = new Array(N);
      let next = 0, kk = 0;
      const stringIdx = [], stringT = [];
      for (let i = 0; i < N; i++) {
        if (isTok[i]) {
          look[i] = tokens[kk];
          act[i] = mark[kk++];
        } else {
          const p = small[next++];
          look[i] = patch(p);
          act[i] = p;
          if (p.part === 'string' && p.s === 0) { stringIdx.push(i); stringT.push(p.t); }
        }
      }

      // the strip: the first ACC tokens are accent, the share of the number; the mark's dots fill the
      // last five of them (the ones nearest the mark), the picture's dots fill all else in order
      const ACC = 13, first = ACC - TOK.n;
      const isMark = (tok) => tok >= first && tok < ACC;
      const strip = Deck.pts.strip({ c: (tok) => (tok < ACC ? Deck.A : Deck.K) });
      const actPts = strip.filter((p) => isMark(p.tok)), restPts = strip.filter((p) => !isMark(p.tok));
      const line = new Array(N);
      let a = 0, b = 0;
      for (let i = 0; i < N; i++) line[i] = isTok[i] ? actPts[a++] : restPts[b++];

      const ring = Deck.wobble({ idx: stringIdx, t: stringT, normal: [0, -1], amp: PL.amp, hz: 8, decay: 0.75 });
      return { seen, look, act, line, tokIdx, stringIdx, stringT, ring, xp, tokRight: tx0 + row, markY };
    },

    beats: [
      {
        layout: (s) => Deck.layout(s.seen),
        caption: () => ({
          headline: 'Увидеть и сделать',
          labels: [{ text: 'модель видит патчи', x: W - M, y: 190, align: 'right' }],
          tag: 'schema',
        }),
        move: { ms: 1300, stagger: 'x', spread: 0.45, curl: 0.12 },
      },
      {
        layout: (s) => Deck.layout(s.look),
        caption: (s) => ({
          headline: 'Увидеть и сделать',
          labels: [{ text: 'токены действия', x: s.tokRight + 28, y: TOK.top + 6 }],
          tag: 'schema',
        }),
        // the token dots leave the picture from everywhere and gather under the string
        move: { ms: 1300, stagger: (i, fx, fy, tx, ty) => Math.hypot(tx - fx, ty - fy), spread: 0.35, curl: 0.16 },
      },
      {
        layout: (s) => Deck.layout(s.act),
        caption: (s) => ({
          headline: 'Увидеть и сделать',
          labels: [{ text: 'действие', x: s.xp + MARK.R + 24, y: s.markY - MARK.R - 26 }],
          tag: 'schema',
        }),
        // patches close; the tokens condense into the mark
        move: { ms: 1200, stagger: 'x', spread: 0.3, curl: 0.1 },
        enter(s, info) {
          if (info.dir > 0) Deck.sound.play(Deck.sound.string('D3'), { delay: 1.2 + PL.pull });
        },
        // the mark comes down onto the string, pulls it up and lets go; the string rings
        live(t, frame, s) {
          const e = Deck.ease.inOut;
          let fy, pull = 0;
          if (t < PL.touch) fy = PL.rest * e(t / PL.touch);
          else if (t < PL.pull) {
            pull = PL.amp * e((t - PL.touch) / (PL.pull - PL.touch));
            fy = PL.rest - pull;
          } else fy = (PL.rest - PL.amp) * (1 - e(Deck.clamp((t - PL.pull) / (PL.lift - PL.pull), 0, 1)));
          for (const i of s.tokIdx) frame.y[i] += fy;
          if (t < PL.pull) {
            for (let k = 0; k < s.stringIdx.length; k++) frame.y[s.stringIdx[k]] -= pull * (1 - Math.abs(2 * s.stringT[k] - 1));
            return true;
          }
          return s.ring(t - PL.pull, frame) || t < PL.lift;
        },
        stillAt: 0.36, // the still frame: the mark has the string pulled up, at its apex
      },
      {
        layout: (s) => Deck.layout(s.line),
        caption: () => ({
          headline: 'Увидеть и сделать',
          figure: { value: D12.value, unit: D12.unit },
          tag: 'schema',
          src: { text: D12.src, v: D12.v },
        }),
        // the body, which sits where the figure goes, lands first and all at once (by ~0.4 of the
        // move, as the figure finishes fading in); then a front sweeps along the neck to the head
        move: { ms: 1300, stagger: (i, fx) => (fx < FIG_X ? 0 : 140 + fx - FIG_X), spread: 0.6, curl: -0.08 },
      },
    ],
  });
})();

</script>
<script>
// ---- states/12-breaks.js
// State 12 (Б). «Уверенно. Неверно.» Beat 0: the dots assemble a dombra with six strings, printed as
// cleanly as the real one, and nothing on screen says it is wrong: the room should count the strings
// before the speaker says «галлюцинация». Beat 1: the same dombra steps up to make room for the
// three places where it breaks and the one number (deepfake detectors in the wild).
// The six-string dombra is our own illustration of a hallucination, not a model output: tag 'schema'.
(function () {
  'use strict';
  const Deck = window.Deck, M = Deck.MARGIN;

  // The one number of this state, fixed in spec.md ("On-screen facts, fixed"): V-23,
  // Deepfake-Eval-2024: open-source video detectors lose 50 % of their AUC on 2024 in-the-wild
  // deepfakes compared with earlier benchmarks. It measures detectors, not people.
  const E = {
    value: '−50 %',
    unit: 'AUC открытых детекторов видео',
    src: 'Deepfake-Eval-2024: видео из сети против прежних тестов',
    v: 'V-23',
  };

  // beat 0: the same place and size as the dombra the deck has been playing, so only the strings change
  const WHOLE = { cx: 640, cy: 390, length: 1120, strings: 6 };
  // beat 1: up and slightly smaller, so the figure gets the lower band
  const UP = { cx: 640, cy: 288, length: 1080, strings: 6 };

  Deck.state(12, {
    setup() {
      return { whole: Deck.pts.dombra(WHOLE), up: Deck.pts.dombra(UP) };
    },

    beats: [
      {
        layout: (s) => Deck.layout(s.whole),
        caption: () => ({ headline: 'Уверенно. Неверно.', tag: 'schema' }),
        // tail first, head last: the instrument is laid down in one confident stroke
        move: { ms: 1400, stagger: 'x', spread: 0.5, curl: 0.12 },
      },
      {
        layout: (s) => Deck.layout(s.up),
        caption: () => ({
          headline: 'Уверенно. Неверно.',
          body: 'Другие границы: дипфейки, цена, оценка.',
          figure: { value: E.value, unit: E.unit, y: 604 },
          tag: 'schema',
          src: { text: E.src, v: E.v },
        }),
        move: { ms: 1000, stagger: 'x', spread: 0.3, curl: 0.04 },
      },
    ],
  });
})();

</script>
<script>
// ---- states/13-choose.js
// State 13 (Б). «Три вопроса перед выбором». No numbers: the questions are the content.
// The real dombra (two strings again) lies across the stage, first only as a pin-dot proof.
// Each press asks one more question, and the instrument is printed up to that question's gate:
// a front of full-tone dots sweeps left to right, so the dombra passes the three gates in turn.
// After the third it stands fully printed, ready to become the word again in state 14.
(function () {
  'use strict';
  const Deck = window.Deck, M = Deck.MARGIN;

  const DOMBRA = { cx: 640, cy: 460, length: 1120 };
  const COL = 384; // three stations across the stage: x 64, 448, 832
  const Q = [
    'Что на входе\nи на выходе?',
    'Нужен ответ\nза доли секунды?',
    'Сколько стоит\nошибка?',
  ];
  const Q_Y = 164, Q_SIZE = 40;
  const GATE = [M + COL - 30, M + 2 * COL - 30, Deck.W + 60]; // printed to the left of the gate
  const RAMP = 44; // the gate is soft: dots shrink across 44 px, like a halftone edge

  Deck.state(13, {
    setup() {
      const base = Deck.pts.dombra(DOMBRA);
      // a beat's picture: full tone left of the gate, a pale proof (pin dots) right of it
      const printed = (gate) =>
        base.map((p) => {
          const f = Deck.clamp((gate - p.x) / RAMP + 0.5, 0, 1), k = f * f * (3 - 2 * f);
          const pale = Math.max(Deck.R_MIN, 0.5 * p.r);
          return Object.assign({}, p, { r: pale + (p.r - pale) * k });
        });
      return { beats: GATE.map(printed) };
    },

    beats: [0, 1, 2].map((k) => ({
      layout: (s) => Deck.layout(s.beats[k]),
      caption: () => ({
        headline: 'Три вопроса перед выбором',
        labels: Q.slice(0, k + 1).map((text, i) => ({ text, x: M + i * COL, y: Q_Y, size: Q_SIZE, upright: true })),
        tag: 'schema',
      }),
      // the front of ink runs along x; from state 12 the six strings close up into two on the way
      move: k === 0 ? { ms: 1300, stagger: 'x', spread: 0.45, curl: 0.1 } : { ms: 1100, stagger: 'x', spread: 0.7, curl: 0 },
    })),
  });
})();

</script>
<script>
// ---- states/14-closing.js
// State 14 (Б). Closing. The dots return to the huge word «домбра» over two strings, exactly the
// composition of state 1 beat 1, so the deck ends where it opened; the thesis replaces the title,
// «Вопросы?» replaces the speakers, and the strings ring once more with the same strum.
(function () {
  'use strict';
  const Deck = window.Deck, { W, N } = Deck;

  Deck.state(14, {
    setup() {
      // Same construction as 01-title.js: two strings edge to edge, the word takes every other dot.
      const strings = [];
      [612, 626].forEach((y, s) => {
        for (const p of Deck.pts.line(3, y, W - 3, y, 213, { r: 2.1, c: Deck.A })) strings.push(Object.assign(p, { s, t: p.u }));
      });
      const word = Deck.pts.text('домбра', { x: 64, y: 516, fit: 1152, count: N - strings.length });
      const all = Deck.pts.sortX(word.concat(strings), 6);
      const idx = [[], []], t = [[], []];
      all.forEach((p, i) => { if (p.s != null) { idx[p.s].push(i); t[p.s].push(p.t); } });
      const ring = [
        Deck.wobble({ idx: idx[0], t: t[0], amp: 7, hz: 7, decay: 0.75 }),
        Deck.wobble({ idx: idx[1], t: t[1], amp: 5, hz: 9.3, decay: 0.6 }),
      ];
      return { all, ring };
    },

    beats: [
      {
        layout: (s) => Deck.layout(s.all),
        caption: () => ({
          headline: { text: 'Разные модальности —\nодно пространство токенов', w: 980 },
          body: 'Вопросы?',
        }),
        // the dombra folds back into its name left to right; the strings land last and ring
        move: { ms: 1400, stagger: (i, fx, fy, tx) => tx, spread: 0.5, curl: 0.2 },
        enter(s, info) {
          if (info.dir > 0) Deck.sound.play(Deck.sound.strum(), { delay: 1.3 });
        },
        live(time, frame, s) {
          const a = s.ring[0](time, frame), b = s.ring[1](time, frame);
          return a || b;
        },
      },
    ],
  });
})();

</script>
<script>
// ---- engine/99-boot.js
// Last file in the bundle: every state module has registered by now.
window.Deck.boot();

</script>
